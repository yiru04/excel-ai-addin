<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>CGU API Key</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/contrib/auto-render.min.js"></script>
<style>
  :root {
    --navy: #0b3d62;
    --navy-dark: #082b45;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #dde3ea;
    --text: #161b22;
    --text-dim: #5b6673;
    --data-bg: #eef3f8;
    --data-text: #0b3d62;
    --ok: #0f7b4d;
    --warn: #a15c00;
    --err: #b3261e;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 13.5px;
  }
  body { display: flex; flex-direction: column; padding: 8px 10px; gap: 5px; }

  .logout-btn {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 10.5px; padding: 2px 4px; white-space: nowrap;
  }
  .logout-btn:hover { color: var(--navy); }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 8px;
  }

  .row { display: flex; gap: 6px; align-items: center; }
  .row + .row { margin-top: 4px; }
  label.field-label { font-size: 10.5px; color: var(--text-dim); min-width: 44px; }

  input[type=password], input[type=text], select {
    flex: 1; padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px;
    font-family: var(--mono); font-size: 11.5px; background: #fcfdfe; color: var(--text);
  }
  select { font-family: var(--sans); }

  button.btn {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--navy);
    background: var(--navy); color: white; cursor: pointer; font-size: 11.5px; font-weight: 600;
    white-space: nowrap;
  }
  button.btn:hover { background: var(--navy-dark); }
  button.btn.ghost { background: transparent; color: var(--navy); }
  button.btn.icon { padding: 6px 9px; }
  button.btn:disabled { background: #b9c6d4; border-color: #b9c6d4; cursor: not-allowed; }

  .key-status { font-size: 10.5px; font-family: var(--mono); min-height: 12px; }
  .key-status.ok { color: var(--ok); }
  .key-status.bad { color: var(--err); }

  /* 連線成功後，把整個 API Key 輸入區塊收成一行，把畫面空間讓給對話本身 */
  .api-compact {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; cursor: pointer; padding: 1px 2px;
  }
  .api-compact .ok-text { color: var(--ok); }
  .api-compact .change-link { color: var(--navy); text-decoration: underline; font-size: 10.5px; }

  .model-toggle { font-size: 10.5px; color: var(--navy); cursor: pointer; text-decoration: underline; }

  /* 選取範圍：仿參考截圖，做成輸入框上方一個小標籤（圖示＋文字＋可關閉），
     不是撐滿整行的粗框方塊 */
  .selection-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--data-bg); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 8px 3px 10px; font-size: 10.5px; margin-bottom: 6px;
  }
  .selection-chip button {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 12px; line-height: 1; padding: 0;
  }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--data-bg); color: var(--data-text);
    border: 1px solid #c9dcee; border-radius: 999px;
    padding: 3px 6px 3px 10px; font-size: 11px; font-family: var(--mono);
  }
  .chip button {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px;
  }

  #chatBox {
    flex: 1; min-height: 200px;
    border: none; border-radius: 0;
    overflow-y: auto; padding: 4px 2px; background: transparent;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* 沒有內容時完全不佔空間，避免一堆空區塊疊出很多用不到的空白 */
  #selectionChipWrap:empty, #conversationAttachmentsWrap:empty,
  #attachmentChipRow:empty, #keyStatus:empty { display: none; }

  .msg { max-width: 94%; }
  .msg.user { align-self: flex-end; }
  .msg.ai, .msg.system { align-self: stretch; max-width: 100%; }

  .bubble {
    padding: 7px 11px; border-radius: 10px; word-break: break-word; line-height: 1.55;
  }
  .msg.user .bubble { background: var(--navy); color: white; border-bottom-right-radius: 3px; white-space: pre-wrap; }

  /* AI 回覆不用對話泡泡，直接是面板背景上的一般文字，跟參考截圖一致 */
  .msg.ai .bubble {
    background: transparent; color: var(--text); padding: 2px 0 0 0; border-radius: 0;
  }
  .msg.ai .bubble p:first-child { margin-top: 0; }
  .msg.ai .bubble p:last-child { margin-bottom: 0; }
  .msg.ai .bubble table { border-collapse: collapse; font-size: 12px; margin: 6px 0; }
  .msg.ai .bubble th, .msg.ai .bubble td { border: 1px solid var(--border); padding: 3px 6px; }
  .msg.ai .bubble code { background: var(--data-bg); padding: 1px 4px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }
  .msg.ai .bubble pre { background: var(--data-bg); padding: 8px; border-radius: 6px; overflow-x: auto; }

  .msg.system .bubble {
    background: #fff8e8; color: var(--warn); font-size: 10.5px;
    border: 1px dashed #ecdbab; white-space: pre-wrap; border-radius: 6px;
    padding: 4px 8px; display: inline-block;
  }

  /* AI 回覆下方的動作列（複製等），固定顯示在左下角，不是浮在文字上方的 hover 按鈕 */
  .msg-actions { display: flex; gap: 10px; margin-top: 5px; }
  .sources-footer {
    font-size: 10px; color: var(--text-dim); margin-top: 4px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.5;
  }
  .msg-actions button {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 10.5px; font-family: var(--sans); padding: 2px 0;
  }
  .msg-actions button:hover { color: var(--navy); }

  /* 步驟式活動紀錄：仿照參考截圖，做成一顆一顆可點開的膠囊型連結
     （例如「Ran 3 searches ›」），不是撐滿整行的文字列 */
  .activity-log { align-self: stretch; margin: 2px 0; display: flex; flex-direction: column; gap: 4px; }
  .step-item {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    font-size: 11.5px; color: var(--text-dim); position: relative;
    background: var(--data-bg); border-radius: 999px; align-self: flex-start;
    border: 1px solid var(--border);
  }
  .step-item .step-icon { flex-shrink: 0; }
  .step-item .step-text { word-break: break-word; }
  .step-item.step-error { background: #fdecec; border-color: #f3c9c9; }
  .step-item.step-error .step-text { color: var(--err); }
  .step-thinking { background: transparent; border: none; padding-left: 2px; }
  .step-thinking .step-text { color: var(--warn); }
  .step-item.clickable { cursor: pointer; }
  .step-item.clickable:hover { background: #e4ecf5; }
  .step-item .step-chevron { flex-shrink: 0; color: var(--text-dim); transition: transform 0.15s; font-size: 10px; }
  .step-detail {
    font-family: var(--sans); font-size: 11px; color: var(--text-dim);
    background: var(--data-bg); border-radius: 6px; padding: 6px 8px;
    margin: -2px 0 2px 4px; white-space: pre-wrap; display: none; word-break: break-all;
  }
  .step-detail.open { display: block; }

  .thinking-dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--warn); margin-right: 3px;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* 整個輸入區是一張圓角卡片：上面文字框、下面一排工具圖示，
     兩者包在同一個框裡，不是各自獨立的元素排成一排 */
  .compose-card {
    border: 1px solid var(--border); border-radius: 16px; background: var(--panel);
    padding: 8px 10px 6px 10px;
  }
  .compose-card textarea {
    display: block; width: 100%; border: none; background: transparent;
    resize: none; font-family: var(--sans); font-size: 13px; color: var(--text);
    max-height: 140px; min-height: 22px; overflow-y: auto; line-height: 1.35;
    padding: 2px 2px 8px 2px;
  }
  .compose-card textarea:focus { outline: none; }
  .compose-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .compose-left, .compose-right { display: flex; align-items: center; gap: 6px; }
  .compose-right button.btn { height: 26px; display: flex; align-items: center; justify-content: center; padding: 0 10px; }

  /* 仿參考截圖：圖示本身沒有邊框、貼在卡片背景上，滑鼠移過去才有淡淡的底色，
     ⏩ 開啟時才用深色標出「目前生效中」 */
  .icon-btn-wrap { position: relative; display: inline-block; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--data-bg); color: var(--navy); }
  .icon-btn.active { background: var(--navy); color: white; }
  /* ⏩ 這個符號本身視覺上比 ＋ 粗重，字級調小一點，兩個圖示大小才會看起來一致 */
  #autoApproveBtn { font-size: 10.5px; }
  .icon-tooltip {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: white; font-size: 10.5px; padding: 4px 8px;
    border-radius: 5px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.12s;
  }
  .icon-btn-wrap:hover .icon-tooltip { opacity: 1; }

  /* 底部只剩一行：左邊操作提示，右邊開新對話／回報問題／顯示所有版本 */
  .footer-note { font-size: 10.5px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .footer-note a { color: var(--navy); cursor: pointer; text-decoration: none; font-weight: 600; }
  .footer-right { display: flex; align-items: center; }
  .model-select-mini {
    font-size: 11px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-family: var(--sans); max-width: 160px;
  }
  .version-tag { font-size: 9.5px; color: var(--text-dim); font-family: var(--mono); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,61,98,0.35); z-index: 9999;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: #fff; border-radius: 10px; padding: 16px; max-width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); font-family: var(--sans);
  }
  .modal-msg { white-space: pre-wrap; font-size: 12.5px; color: var(--text); margin-bottom: 12px; line-height: 1.5; max-height: 50vh; overflow-y: auto; }
  .modal-btn-row { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
  <div class="panel" id="apiKeyPanel">
    <div id="apiKeyExpanded">
      <div class="row">
        <label class="field-label">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
        <button class="btn ghost" onclick="testKey()">連線</button>
        <button class="logout-btn" id="logoutBtn" onclick="doLogout()" title="登出（清除目前的 API Key）">↪ 登出</button>
      </div>
      <div id="keyStatus" class="key-status"></div>
    </div>
    <div id="apiKeyCompact" class="api-compact" style="display:none;" onclick="expandApiKeyPanel()">
      <span class="ok-text">✓ 已連線</span>
      <span class="change-link">更改</span>
    </div>
  </div>

  <div id="chatBox"></div>
  <div id="conversationAttachmentsWrap"></div>

  <div class="compose-card">
    <div id="selectionChipWrap"></div>
    <div class="chip-row" id="attachmentChipRow"></div>
    <textarea id="userInput" rows="1" placeholder="向 CGU API Key 尋求協助"></textarea>
    <div class="compose-toolbar">
      <div class="compose-left">
        <input type="file" id="fileAttach" style="display:none" multiple accept=".txt,.csv,.json,.md,.tsv,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp" />
        <span class="icon-btn-wrap">
          <button class="icon-btn" onclick="document.getElementById('fileAttach').click()">＋</button>
          <span class="icon-tooltip">附加檔案</span>
        </span>
        <span class="icon-btn-wrap">
          <button class="icon-btn" id="autoApproveBtn" onclick="toggleAutoApproveWrites()">⏩</button>
          <span class="icon-tooltip" id="autoApproveTooltip">接受所有變更</span>
        </span>
      </div>
      <div class="compose-right">
        <select id="modelSelect" class="model-select-mini"><option value="">先連線以載入模型清單</option></select>
        <button class="btn" id="sendBtn" onclick="sendMessage()">送出</button>
        <button class="btn ghost" id="stopBtn" onclick="stopCurrentRequest()" style="display:none;">停止</button>
      </div>
    </div>
  </div>
  <div class="footer-note">
    <span>Enter 送出，Shift+Enter 換行</span>
    <span class="footer-right">
      <span class="version-tag" id="versionTag"></span>
      　<a onclick="resetConversation()">開新對話</a>
      　<a id="reportLink" href="#">回報問題</a>
      　<span class="model-toggle" id="modelToggle" onclick="toggleModelListMode()" style="display:none;">顯示所有版本</span>
    </span>
  </div>

<script>
  // ============================================================
  // 基本設定
  // ============================================================
  const APP_VERSION = "v6.0";
  const REPORT_EMAIL = "b1245031@cgu.edu.tw";
  document.getElementById('versionTag').textContent = APP_VERSION;
  document.getElementById('reportLink').href =
    'mailto:' + REPORT_EMAIL +
    '?subject=' + encodeURIComponent('CGU API Key 增益集問題回報（' + APP_VERSION + '）') +
    '&body=' + encodeURIComponent('請描述你遇到的狀況（可以附上截圖另外寄）：\n\n\n---\n版本：' + APP_VERSION);

  // PDF / Word 解析改由後端負責（見 extract.py），不再依賴瀏覽器端的 CDN 函式庫
  const EXTRACT_API_URL = "https://excel-ai-addin-nu.vercel.app/api/extract";

  let previousResponseId = null;
  const SCRATCH_SHEET = "AI_Scratch";
  let scratchRow = 1;

  const CGU_ROOT = "https://air.cgu.edu.tw/cgullmapi/v1";
  const CGU_URL = CGU_ROOT + "/responses";
  const MODELS_URL = CGU_ROOT + "/models";

  let excludeSelectionContext = false;
  let attachedFiles = []; // [{ name, kind: 'text'|'image', content?, dataUri? }]
  let conversationAttachments = []; // 這個對話裡曾經提供過的檔案名稱（僅供顯示，不重複傳送內容）
  let allModelIds = [];
  let showAllModels = false;

  function getSelectedModel() {
    const sel = document.getElementById('modelSelect');
    return sel.value || "gpt-5.4-mini";
  }

  const SYSTEM_INSTRUCTIONS =
    "你是嵌入在 Excel 裡的財務分析助手，服務對象是財務工程課程的學生。" +
    "使用者的問題可能需要查詢 Bloomberg 即時或歷史資料才能回答，" +
    "遇到這種情況請務必呼叫對應的工具取得真實資料，不要憑猜測回答。" +
    "get_bloomberg_field / get_bloomberg_history / get_bloomberg_bulk 這三個工具的 field 參數" +
    "接受任何 Bloomberg 欄位代碼，不限於範例裡提到的那幾個——只要是 Bloomberg 終端機上查得到、" +
    "能用 BDP/BDH/BDS 公式取得的資料（財報數據、評等、選擇權希臘值、指數成分、殖利率等等），" +
    "都可以直接嘗試對應的欄位代碼。如果你不確定某個資料對應的正確欄位代碼，" +
    "先用你自己的知識判斷最可能的代碼；如果查詢結果顯示錯誤或查無資料，" +
    "可以用網頁搜尋工具查詢正確的 Bloomberg 欄位代碼（例如搜尋「Bloomberg field 本益比」），" +
    "找到後再重新查詢一次，不要因為一次查詢失敗就放棄或直接告訴使用者做不到。" +
    "完成使用者要求的任務時，請盡量一次做完整個任務，不要每次都在結尾用「要不要我接下來再幫你做 A/B/C」" +
    "這種方式把工作拆成好幾輪對話——如果使用者的原始要求裡已經隱含需要哪些後續步驟" +
    "（例如「幫我整理成一張分析表」通常代表要把資料清理、建表、算好欄位都一次做完，" +
    "不是只搭好空表格骨架就停下來問），請直接把合理範圍內能做的都做完，" +
    "只有在真的缺少必要資訊、或有多種做法需要使用者選擇時，才需要停下來問清楚，" +
    "而不是每一步都跟使用者確認要不要繼續。" +
    "如果問題需要最新的網路資訊（例如新聞、時事、非 Bloomberg 涵蓋的資料），可以使用網頁搜尋工具。" +
    "如果使用者附加了圖片，請根據圖片實際內容回答，不要憑空想像圖片裡有什麼。" +
    "使用者在同一個對話裡先前附加過的檔案內容，仍然保留在對話歷史中，你可以直接參考，" +
    "使用者也可能一次附加多個檔案（多份文字/PDF/Word 或多張圖片），請把它們當成彼此獨立、" +
    "各自有名稱標示的內容來源，回答時清楚說明資訊來自哪一份檔案，不要混在一起講。" +
    "不需要每次都要求使用者重新上傳——只有在使用者提到的檔案從未在這個對話裡出現過時，才需要請他們附加。" +
    "如果使用者附加了 PDF 或 Word 文件，內容已經被轉換成純文字附加在訊息裡（可能因為掃描檔而擷取不到文字，" +
    "如果附加內容看起來是空的或亂碼，請直接告訴使用者可能是掃描檔無法擷取文字，不要編造內容）。" +
    "如果分析結果是一張表格（例如選擇權鏈、多期限比較），優先呼叫 create_worksheet " +
    "建立新的工作表、再用 write_table 把整張表寫進去，不要把大量資料塞進單一儲存格或直接貼在聊天回覆裡。" +
    "write_table 寫入時系統會自動套用專業報表樣式（標題列、斑馬紋、格線、數字自動統一格式），你只需要專注在資料內容本身正確即可，" +
    "除非使用者特別要求（例如「不要顏色」「要列印用的簡單版」），才需要另外調整。" +
    "如果表格是矩陣型交叉表（橫軸縱軸都是分類標籤，中間是交叉算出來的數值，例如波動率×到期時間的敏感度分析、" +
    "不同履約價×不同到期日的選擇權定價表），呼叫 write_table 時請把 matrix_style 設為 true，" +
    "讓第一欄也套用標題樣式、方便使用者對照橫軸縱軸；一般由左到右一列一筆資料的清單型表格則不需要設定。" +
    "呼叫 write_table 時，請善用 column_formats 參數依照每欄資料的意義給正確的數字格式——" +
    "利率、殖利率、波動率、機率這類介於 0 到 1 之間的比率請用百分比格式（例如 \"0.00%\"），" +
    "股價、選擇權價格、金額這類請用貨幣格式（例如 \"$#,##0.00\"），不要讓利率這種小數值" +

  // Markdown 的跳脫符號機制會把 LaTeX 定界符（例如 \[ \( ）裡的反斜線吃掉，
  // 導致 KaTeX 事後完全找不到定界符、渲染不出數學公式。
  // 解法：先把整段數學內容抽換成不含特殊符號的代號、讓 Markdown 處理完其他排版，
  // 再把原始的 LaTeX 內容換回去，確保 KaTeX 拿到的定界符是完整、沒被動過的。
  // 網頁搜尋工具有時候會在回傳文字裡夾帶內部用的引用參照標記
  // （例如「畺cite畺turn1search0畺」這種），不是給使用者看的內容，
  // Markdown 排版前先清掉，不然會直接顯示成一串看不懂的亂碼。
  function stripCitationArtifacts(text) {
    return String(text).replace(/畺[a-zA-Z0-9]*/g, '');
  }

  function renderMarkdown(text) {
    text = stripCitationArtifacts(text);
    const mathBlocks = [];
    const protectedText = text.replace(
      /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))/g,
      (match) => {
        const idx = mathBlocks.length;
        mathBlocks.push(match);
        return `@@MATH${idx}@@`;
      }
    );
    let raw = marked.parse(protectedText, { breaks: true });
    let clean = DOMPurify.sanitize(raw);
    clean = clean.replace(/@@MATH(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)] || '');
    return clean;
  }

  // 模型有時候會用 LaTeX 語法輸出數學式（例如 \[ \boxed{P=5.66\times10^3} \]），
  // Markdown 本身不認得這種語法，得靠 KaTeX 另外掃一次、把它排版成正常的數學公式。
  function renderMathIn(el) {
    if (typeof renderMathInElement === 'undefined') return;
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {
      // 數學排版失敗就保留原始文字，不影響訊息其他部分正常顯示
    }
  }

  function addMessage(role, text, options) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'ai') {
      const cleanText = stripCitationArtifacts(text);
      bubble.innerHTML = renderMarkdown(cleanText);
      renderMathIn(bubble);
      div.appendChild(bubble);
      div.appendChild(buildMsgActions(cleanText));
    } else {
      bubble.textContent = text;
      div.appendChild(bubble);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    // 使用者自己解決不了的技術性錯誤，看太久只會覺得莫名其妙，
    // 顯示一段時間後自動淡出、從畫面移除，不會一直堆在對話裡。
    if (options && options.autoFade) {
      setTimeout(() => {
        div.style.transition = 'opacity 0.6s ease';
        div.style.opacity = '0';
        setTimeout(() => div.remove(), 700);
      }, 7000);
    }

    return div;
  }

  // AI 回覆下方的動作列（目前只有複製），固定在左下角、一直看得到，
  // 不是浮在文字上、要 hover 才出現的按鈕。用小灰字取代圖示，跟參考截圖一致。
  function buildMsgActions(text) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '複製';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text);
      copyBtn.textContent = '已複製';
      setTimeout(() => copyBtn.textContent = '複製', 1200);
    };
    actions.appendChild(copyBtn);
    return actions;
  }

  // 步驟式活動紀錄：取代原本一則一則的彩色訊息泡泡。
  // 每個使用者問題會開一個活動區塊，裡面每個動作（搜尋、查詢、寫入…）
  // 各佔一行（圖示＋一句話），最下面永遠是目前進行中的狀態（會動的小點點）。
  // 點一行可以展開該行的技術細節，不點就是精簡的一行字，仿照參考截圖的呈現方式。
  // ============================================================
  let activityLog = null;
  let thinkingStepEl = null;

  function ensureActivityLog() {
    if (!activityLog) {
      activityLog = document.createElement('div');
      activityLog.className = 'activity-log';
      chatBox.appendChild(activityLog);
    }
    return activityLog;
  }

  function setThinkingText(text) {
    const log = ensureActivityLog();
    if (!thinkingStepEl) {
      thinkingStepEl = document.createElement('div');
      thinkingStepEl.className = 'step-item step-thinking';
      log.appendChild(thinkingStepEl);
    }
    thinkingStepEl.innerHTML =
      '<span class="step-text">' + text + '</span>' +
      '<span class="thinking-dots"><span></span><span></span><span></span></span>';
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function iconForToolName(name) {
    const map = {
      get_bloomberg_field: '📊', get_bloomberg_history: '📈', get_bloomberg_bulk: '📚',
      read_range: '📄', explain_formula: '🧮', write_to_cell: '✏️',
      create_worksheet: '📑', write_table: '📝', web_search: '🔍', create_chart: '🖼️'
    };
    return map[name] || '⚙️';
  }

  function categoryLabelForIcon(icon) {
    const map = {
      '🔍': '已搜尋網路', '📊': '已查詢 Bloomberg 即時資料', '📈': '已查詢 Bloomberg 歷史資料',
      '📚': '已查詢 Bloomberg 批次資料', '📄': '已讀取儲存格內容', '🧮': '已查看公式',
      '✏️': '已寫入儲存格', '📑': '已建立/切換工作表', '📝': '已寫入表格', '🖼️': '已插入圖表'
    };
    return map[icon] || '已執行操作';
  }

  // 同一種操作只顯示一行＋次數（例如查了 5 次 Bloomberg 歷史資料、或連續 3 次不同
  // 標的的查詢失敗，都只顯示一行＋次數），不會一項一行洗版。點這一行可以展開，
  // 裡面是一般人看得懂的純文字明細（每項各自一句話），不是原始 JSON 程式碼。
  function commitSteps(items) {
    const log = ensureActivityLog();
    if (thinkingStepEl) { thinkingStepEl.remove(); thinkingStepEl = null; }

    const groups = {};
    const orderedKeys = [];

    items.forEach((it) => {
      const icon = it.isError ? '⚠️' : (it.icon || '⚙️');
      const key = (it.isError ? 'err:' : 'ok:') + icon;
      if (!groups[key]) {
        groups[key] = {
          icon, isError: !!it.isError,
          label: it.isError ? '執行時發生問題' : categoryLabelForIcon(it.icon),
          entries: []
        };
        orderedKeys.push(key);
      }
      groups[key].entries.push(it.summary);
    });

    orderedKeys.forEach((key) => addGroupedStepLine(log, groups[key]));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // 建立一行「圖示＋分類名稱＋次數」，點擊展開底下的純文字明細清單。
  // 網頁搜尋的來源網址列表也共用這個元件呈現。
  function addGroupedStepLine(log, g) {
    const item = document.createElement('div');
    item.className = 'step-item clickable' + (g.isError ? ' step-error' : '');
    const iconSpan = document.createElement('span');
    iconSpan.className = 'step-icon';
    iconSpan.textContent = g.icon;
    const textSpan = document.createElement('span');
    textSpan.className = 'step-text';
    textSpan.textContent = g.label + (g.entries.length > 1 ? `（${g.entries.length} 項，點擊展開）` : '（點擊展開）');
    const chevron = document.createElement('span');
    chevron.className = 'step-chevron';
    chevron.textContent = '›';
    item.appendChild(iconSpan);
    item.appendChild(textSpan);
    item.appendChild(chevron);

    const detailDiv = document.createElement('div');
    detailDiv.className = 'step-detail';
    detailDiv.textContent = g.entries.join('\n');

    item.onclick = () => {
      const isOpen = detailDiv.classList.toggle('open');
      chevron.style.transform = isOpen ? 'rotate(90deg)' : 'rotate(0deg)';
    };
    log.appendChild(item);
    log.appendChild(detailDiv);
  }

  // 一個使用者問題處理完成（不管是給出最終答案，還是中途出錯結束），
  // 把整個步驟清單（搜尋、查詢、建表、錯誤……全部）從畫面上移除，
  // 只留下最終的回覆或錯誤訊息，不會讓過程中的東西一直堆在對話裡。
  function finishActivityLog() {
    if (thinkingStepEl) { thinkingStepEl.remove(); thinkingStepEl = null; }
    if (activityLog) { activityLog.remove(); }
    activityLog = null;
  }

  // 回覆下方永久保留的資料來源列（跟步驟清單不同，這個不會被 finishActivityLog 清掉）：
  // 這次用到的 Bloomberg 欄位、參考過的外部網站，都整理在同一個地方，純文字呈現。
  function buildSourcesFooter(bloombergSources, webSources) {
    if (bloombergSources.length === 0 && webSources.length === 0) return null;
    const wrap = document.createElement('div');
    wrap.className = 'sources-footer';
    const lines = [];
    if (bloombergSources.length > 0) {
      const unique = [...new Set(bloombergSources.map(s => `${s.ticker} / ${s.field}`))];
      lines.push('📊 Bloomberg：' + unique.join('、'));
    }
    if (webSources.length > 0) {
      const unique = [...new Set(webSources.map(s => s.url))];
      lines.push('🔗 網路來源：' + unique.join('、'));
    }
    wrap.textContent = lines.join('\n');
    return wrap;
  }

  async function typewriterReveal(text, bloombergSources, webSources) {
    finishActivityLog();
    const div = document.createElement('div');
    div.className = 'msg ai';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    div.appendChild(bubble);
    chatBox.appendChild(div);

    const chars = Array.from(text);
    const step = Math.max(1, Math.floor(chars.length / 120));
    for (let i = 0; i <= chars.length; i += step) {
      const partial = chars.slice(0, i).join('');
      bubble.innerHTML = renderMarkdown(partial);
      chatBox.scrollTop = chatBox.scrollHeight;
      await new Promise(r => setTimeout(r, 8));
    }
    bubble.innerHTML = renderMarkdown(text);
    renderMathIn(bubble);
    div.appendChild(buildMsgActions(stripCitationArtifacts(text)));
    const sourcesFooter = buildSourcesFooter(bloombergSources || [], webSources || []);
    if (sourcesFooter) div.appendChild(sourcesFooter);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function resetConversation() {
    previousResponseId = null;
    chatBox.innerHTML = '';
    activityLog = null;
    thinkingStepEl = null;
    conversationAttachments = [];
    autoApproveWritesThisConversation = false;
    updateAutoApproveButton();
    renderConversationAttachmentsBar();
    addMessage('system', '已開新對話。');
  }

  // 顯示「這個對話裡目前已經提供過哪些檔案」，讓使用者不用猜模型記不記得。
  // 只是顯示清單，不會因為這個清單而重新傳送檔案內容——內容已經在對話歷史裡了。
  function renderConversationAttachmentsBar() {
    const wrap = document.getElementById('conversationAttachmentsWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (conversationAttachments.length === 0) return;
    const bar = document.createElement('div');
    bar.className = 'selection-chip';
    bar.style.color = 'var(--navy)';
    bar.innerHTML = `<span>📚 本次對話中已提供：${conversationAttachments.join('、')}</span>`;
    wrap.appendChild(bar);
  }

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ============================================================
  // 自訂確認視窗（Office Add-in 環境不支援 window.confirm/alert）
  // ============================================================
  function showModal(bodyHtmlOrText, buttons) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal-box';
      const msg = document.createElement('div');
      msg.className = 'modal-msg';
      if (typeof bodyHtmlOrText === 'string') msg.textContent = bodyHtmlOrText;
      else msg.appendChild(bodyHtmlOrText);
      const btnRow = document.createElement('div');
      btnRow.className = 'modal-btn-row';
      buttons.forEach(b => {
        const btn = document.createElement('button');
        btn.textContent = b.label;
        btn.className = b.primary ? 'btn' : 'btn ghost';
        btn.onclick = () => { document.body.removeChild(overlay); resolve(b.value); };
        btnRow.appendChild(btn);
      });
      box.appendChild(msg);
      box.appendChild(btnRow);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    });
  }

  // 統一的寫入確認：不管這一輪有 1 個還是多個寫入動作，都走同一套流程，
  // 按鈕文字依數量調整（1 個顯示「允許」，多個顯示「全部允許」）。
  let autoApproveWritesThisConversation = false;

  // ＋號附加檔案、⏩ 一鍵允許本次對話後續所有寫入（點一次切換開關狀態，
  // 開啟時圖示會變成深色，跟參考截圖裡「Accept all edits」的概念一致，
  // 只是我們做成一個持續生效的開關，而不是每次都要跳出來按一次）
  function updateAutoApproveButton() {
    const btn = document.getElementById('autoApproveBtn');
    const tip = document.getElementById('autoApproveTooltip');
    if (!btn) return;
    btn.classList.toggle('active', autoApproveWritesThisConversation);
    if (tip) tip.textContent = autoApproveWritesThisConversation ? '已允許本次對話所有變更（點擊取消）' : '接受所有變更';
  }

  function toggleAutoApproveWrites() {
    autoApproveWritesThisConversation = !autoApproveWritesThisConversation;
    updateAutoApproveButton();
  }

  // 登出：因為我們沒有真正的帳號系統，這裡的「登出」實際上是清掉目前貼上的
  // API Key、重置連線狀態，效果上等同於結束這次使用階段，之後要用得重新貼 Key。
  function doLogout() {
    document.getElementById('apiKey').value = '';
    const statusDiv = document.getElementById('keyStatus');
    statusDiv.className = 'key-status';
    statusDiv.textContent = '';
    expandApiKeyPanel();
    const select = document.getElementById('modelSelect');
    select.innerHTML = '<option value="">先連線以載入模型清單</option>';
    document.getElementById('modelToggle').style.display = 'none';
    allModelIds = [];
    resetConversation();
    addMessage('system', '已登出，請重新貼上 API Key 並按「連線」才能繼續使用。');
  }

  function confirmWrites(writeCalls) {
    if (autoApproveWritesThisConversation) return Promise.resolve(true);

    const container = document.createElement('div');
    if (writeCalls.length > 1) {
      const title = document.createElement('div');
      title.style.cssText = 'font-weight:600; margin-bottom:8px;';
      title.textContent = `AI 想要執行以下 ${writeCalls.length} 個會修改活頁簿的動作：`;
      container.appendChild(title);
    } else {
      const title = document.createElement('div');
      title.style.cssText = 'font-weight:600; margin-bottom:8px;';
      title.textContent = 'AI 想要執行以下會修改活頁簿的動作：';
      container.appendChild(title);
    }
    const list = document.createElement('div');
    list.style.cssText = 'font-family:var(--mono); font-size:11.5px; line-height:1.7;';
    writeCalls.forEach((fc, i) => {
      const line = document.createElement('div');
      line.textContent = (writeCalls.length > 1 ? `${i + 1}. ` : '') + describeToolCall(fc.name, fc._args);
      list.appendChild(line);
    });
    container.appendChild(list);

    const autoRow = document.createElement('label');
    autoRow.style.cssText = 'display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11.5px; color:var(--text-dim); cursor:pointer;';
    const autoCheckbox = document.createElement('input');
    autoCheckbox.type = 'checkbox';
    autoRow.appendChild(autoCheckbox);
    autoRow.appendChild(document.createTextNode('本次對話後續的寫入都自動允許，不用再問我'));
    container.appendChild(autoRow);

    const allowLabel = writeCalls.length > 1 ? '全部允許' : '允許';
    const cancelLabel = writeCalls.length > 1 ? '全部取消' : '取消';
    return showModal(container, [
      { label: cancelLabel, value: false, primary: false },
      { label: allowLabel, value: true, primary: true }
    ]).then((result) => {
      if (result && autoCheckbox.checked) {
        autoApproveWritesThisConversation = true;
        updateAutoApproveButton();
      }
      return result;
    });
  }

  // ============================================================
  // 模型清單：動態抓取 + 依 OpenAI 官方定位分級 + 精簡/完整兩種顯示模式
  // ============================================================
  function getModelTierLabel(id) {
    const lower = id.toLowerCase();
    const firstSegment = lower.split(/[-_]/)[0];
    if (/^o\d/.test(firstSegment) && !lower.includes('codex')) return '推理強化版';
    if (lower.includes('codex')) return '程式碼專用版';
    if (lower.includes('nano')) return '極速版';
    if (lower.includes('mini')) return '輕量版';
    if (lower.includes('pro')) return '進階版';
    return '標準版';
  }

  function parseVersionKey(id) {
    const m = id.match(/(\d+(?:\.\d+)*)/);
    if (!m) return [0];
    return m[1].split('.').map(Number);
  }
  function compareVersions(a, b) {
    const va = parseVersionKey(a), vb = parseVersionKey(b);
    const len = Math.max(va.length, vb.length);
    for (let i = 0; i < len; i++) {
      const x = va[i] || 0, y = vb[i] || 0;
      if (x !== y) return x - y;
    }
    return 0;
  }

  // 精簡模式：每個等級只挑「版本最新」的一個代表，避免同一個標籤重複一長串
  function buildCuratedModelList(ids) {
    const skipPatterns = ['-latest', 'chat-latest'];
    const candidates = ids.filter(id => !skipPatterns.some(p => id.includes(p)));
    const byTier = {};
    candidates.forEach(id => {
      const tier = getModelTierLabel(id);
      if (!byTier[tier] || compareVersions(id, byTier[tier]) > 0) byTier[tier] = id;
    });
    const tierOrder = ['極速版', '輕量版', '標準版', '進階版', '程式碼專用版', '推理強化版'];
    return tierOrder.filter(t => byTier[t]).map(t => byTier[t]);
  }

  function populateModelSelect() {
    const select = document.getElementById('modelSelect');
    const ids = showAllModels ? allModelIds : buildCuratedModelList(allModelIds);
    select.innerHTML = '';
    let defaultSet = false;
    ids.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      opt.title = id;
      if (!defaultSet && getModelTierLabel(id) === '標準版') { opt.selected = true; defaultSet = true; }
      select.appendChild(opt);
    });
    if (!defaultSet && select.options.length > 0) select.options[0].selected = true;
    document.getElementById('modelToggle').textContent = showAllModels ? '只顯示精簡清單' : '顯示所有版本';
  }

  function toggleModelListMode() {
    showAllModels = !showAllModels;
    populateModelSelect();
  }

  async function loadModels(key) {
    const select = document.getElementById('modelSelect');
    const toggle = document.getElementById('modelToggle');
    try {
      const resp = await fetch(MODELS_URL, { headers: { 'Authorization': 'Bearer ' + key } });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error ? data.error.message : ('HTTP ' + resp.status));

      const EXCLUDE_PATTERNS = ['embedding', 'image', 'whisper', 'tts', 'realtime', 'transcribe', 'diarize', 'deep-research'];
      allModelIds = (data.data || []).map(m => m.id).filter(id =>
        !id.includes(':') && !EXCLUDE_PATTERNS.some(p => id.toLowerCase().includes(p))
      ).sort();

      if (allModelIds.length === 0) {
        select.innerHTML = '<option value="gpt-5.4-mini">gpt-5.4-mini</option>';
        toggle.style.display = 'none';
        return;
      }
      showAllModels = false;
      populateModelSelect();
      toggle.style.display = 'inline-block';
    } catch (e) {
      // 抓取失敗時清楚標示「未連線」，不要顯示一個看起來正常、可選、打勾的假選項，
      // 避免使用者看到「連線失敗」跟「模型選好了」同時出現這種矛盾畫面。
      select.innerHTML = '<option value="" disabled selected>（尚未連線，無法取得模型清單）</option>';
      toggle.style.display = 'none';
    }
  }

  function expandApiKeyPanel() {
    document.getElementById('apiKeyExpanded').style.display = 'block';
    document.getElementById('apiKeyCompact').style.display = 'none';
  }
  function collapseApiKeyPanel() {
    document.getElementById('apiKeyExpanded').style.display = 'none';
    document.getElementById('apiKeyCompact').style.display = 'flex';
  }

  async function testKey() {
    const key = document.getElementById('apiKey').value.trim();
    const statusDiv = document.getElementById('keyStatus');
    if (!key) { statusDiv.textContent = ''; return; }
    statusDiv.className = 'key-status';
    statusDiv.textContent = '連線中...';
    await loadModels(key);
    try {
      const resp = await fetch(CGU_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: getSelectedModel(), input: '回覆「ok」兩個字即可', max_output_tokens: 20 })
      });
      if (resp.ok) {
        statusDiv.className = 'key-status ok';
        statusDiv.textContent = '✓ 已連線';
        collapseApiKeyPanel();
      } else {
        const data = await resp.json().catch(() => ({}));
        statusDiv.className = 'key-status bad';
        statusDiv.textContent = '✗ ' + (data.error ? data.error.message : ('連線失敗，狀態碼 ' + resp.status));
      }
    } catch (e) {
      statusDiv.className = 'key-status bad';
      statusDiv.textContent = '✗ 連線失敗：' + e.message;
    }
  }

  // ============================================================
  // 檔案附加：文字類 / PDF / Word / 圖片
  // ============================================================
  const TEXT_EXTS = ['txt', 'csv', 'json', 'md', 'tsv'];
  const MAX_TEXT_CHARS = 30000;

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  function readFileAsDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 不管卡住的真正原因是什麼（後端沒回應、網路問題、或其他未知狀況），
  // 都不該讓使用者永遠卡在「解析中」動彈不得——加一個逾時保護，超過時間直接判定失敗。
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(`${label}超過 ${ms / 1000} 秒沒有回應，已放棄解析，請稍後再試一次。`)), ms))
    ]);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // readAsDataURL 結果格式是 "data:application/pdf;base64,xxxx"，只取逗號後面的部分
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // PDF / Word 解析改由後端負責（extract.py，跑在 Vercel），用真正的 Python 函式庫
  // （pdfplumber / python-docx）解析，這跟 Claude、ChatGPT 平常處理檔案的方式一樣，
  // 不再依賴瀏覽器端的 CDN 函式庫，也就不會再受相容性問題影響。
  async function extractViaBackend(file, type, onProgress) {
    onProgress('① 正在讀取檔案內容...');
    const base64 = await fileToBase64(file);

    onProgress('② 檔案已讀取完成，正在傳送給伺服器解析（可能需要幾秒）...');
    let resp;
    try {
      resp = await fetch(EXTRACT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, content: base64 })
      });
    } catch (netErr) {
      throw new Error(`③ 網路請求失敗，很可能是連不到解析伺服器：${netErr.message}`);
    }

    onProgress(`③ 伺服器已回應（狀態碼 ${resp.status}），正在解析回傳內容...`);
    const data = await resp.json();
    if (!resp.ok || data.error) {
      throw new Error(data.error || `④ 後端解析失敗（HTTP ${resp.status}）`);
    }
    onProgress('④ 解析完成！');
    return data.text || '';
  }

  async function extractPdfText(file, onProgress) {
    return extractViaBackend(file, 'pdf', onProgress);
  }

  async function extractDocxText(file, onProgress) {
    return extractViaBackend(file, 'docx', onProgress);
  }

  document.getElementById('fileAttach').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;

    for (const file of files) {
      const ext = file.name.split('.').pop().toLowerCase();
      try {
        let newFile;
        if (TEXT_EXTS.includes(ext)) {
          const text = await readFileAsText(file);
          const truncated = text.length > MAX_TEXT_CHARS;
          newFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
        } else if (ext === 'pdf') {
          const progress = (msg) => addMessage('system', msg);
          const text = await withTimeout(extractPdfText(file, progress), 20000, 'PDF 解析');
          const truncated = text.length > MAX_TEXT_CHARS;
          newFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
          if (!text.trim()) addMessage('system', `「${file.name}」似乎擷取不到文字內容，可能是掃描檔（純圖片），文字解析工具無法處理這種情況。`);
        } else if (ext === 'docx') {
          const progress = (msg) => addMessage('system', msg);
          const text = await withTimeout(extractDocxText(file, progress), 20000, 'Word 解析');
          const truncated = text.length > MAX_TEXT_CHARS;
          newFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
        } else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
          const dataUri = await readFileAsDataUri(file);
          newFile = { name: file.name, kind: 'image', dataUri };
        } else {
          addMessage('system', `不支援「.${ext}」這種檔案類型。目前支援：文字類（txt/csv/json/md/tsv）、PDF、Word（docx）、圖片（png/jpg/gif/webp）。`);
          continue;
        }
        attachedFiles.push(newFile);
        renderAttachmentChip();
      } catch (err) {
        addMessage('system', `解析檔案「${file.name}」時發生錯誤：${err.message}`);
      }
    }
  });

  function renderAttachmentChip() {
    const row = document.getElementById('attachmentChipRow');
    row.innerHTML = '';
    attachedFiles.forEach((f, idx) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const icon = f.kind === 'image' ? '🖼️' : '📎';
      const label = document.createElement('span');
      label.textContent = icon + ' ' + f.name + (f.truncated ? '（已截斷）' : '');
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.onclick = () => { attachedFiles.splice(idx, 1); renderAttachmentChip(); };
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      row.appendChild(chip);
    });
  }

  // ============================================================
  // 選取範圍情境感知：事件驅動即時更新（不再用輪詢）
  // ============================================================
  let lastSelectionInfo = null;

  async function refreshSelectionInfo() {
    try {
      lastSelectionInfo = await Excel.run(async (context) => {
        const activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("name");
        const selection = context.workbook.getSelectedRange();
        selection.load("address,values");
        await context.sync();
        return {
          sheetName: activeSheet.name,
          address: selection.address,
          previewRows: selection.values.slice(0, 8).map(r => r.slice(0, 8))
        };
      });
    } catch (e) {
      lastSelectionInfo = null;
    }
    renderSelectionBar();
  }

  function renderSelectionBar() {
    const wrap = document.getElementById('selectionChipWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (!lastSelectionInfo || excludeSelectionContext) return;
    const chip = document.createElement('div');
    chip.className = 'selection-chip';
    const label = document.createElement('span');
    label.textContent = `⊞ ${lastSelectionInfo.sheetName} ${lastSelectionInfo.address.includes('!') ? lastSelectionInfo.address.split('!')[1] : lastSelectionInfo.address} selected`;
    const removeBtn = document.createElement('button');
    removeBtn.title = '不要把這個選取範圍送給 AI';
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => { excludeSelectionContext = true; renderSelectionBar(); };
    chip.appendChild(label);
    chip.appendChild(removeBtn);
    wrap.appendChild(chip);
  }

  async function setupSelectionListener() {
    try {
      await Excel.run(async (context) => {
        context.workbook.onSelectionChanged.add(async () => { await refreshSelectionInfo(); });
        await context.sync();
      });
    } catch (e) {
      // 監聽事件失敗（少見的環境限制）就退回輪詢，確保至少還會更新
      setInterval(refreshSelectionInfo, 3000);
    }
  }

  userInput.addEventListener('focus', () => {
    excludeSelectionContext = false;
    refreshSelectionInfo();
  });

  // ============================================================
  // Bloomberg / Excel 工具實作
  // ============================================================
  const BLOOMBERG_ERROR_MARKERS = [
    "#N/A", "Invalid Security", "Field Not Applicable", "Not Applicable",
    "Requesting Data", "#NAME?", "#REF!", "#VALUE!", "Unknown Field",
    "Invalid Field", "Insufficient", "Permission", "No Data", "Limit Reached",
    "Illegal", "Unauthorized", "PERM_DENIED", "DAPI"
  ];
  function detectBloombergError(text) {
    const s = String(text == null ? "" : text);
    return BLOOMBERG_ERROR_MARKERS.some(m => s.includes(m));
  }

  function friendlyExcelError(e) {
    const code = e && e.code ? e.code : "";
    const raw = e && e.message ? e.message : String(e);
    const hints = {
      "ItemNotFound": "找不到指定的工作表或範圍，請確認工作表名稱、儲存格位址是否正確。",
      "InvalidArgument": "提供的儲存格範圍格式不正確（例如 A1:C10 這種 A1 表示法），請檢查格式。",
      "GeneralException": "Excel 執行時發生一般性錯誤，可能是活頁簿正在被鎖定或有未完成的編輯，請確認目前沒有儲存格處於編輯狀態後再試一次。",
      "InvalidOperation": "目前無法對這個工作表執行此操作，可能是工作表已被保護。"
    };
    return hints[code] || raw;
  }

  function truncateSafely(str, maxChars) {
    const chars = Array.from(str);
    if (chars.length <= maxChars) return str;
    return chars.slice(0, maxChars).join('') + ' ...(已截斷)';
  }

  function formatToolResultForDisplay(result) {
    try {
      const pretty = JSON.stringify(result, null, 2);
      return truncateSafely(pretty, 500);
    } catch (e) {
      return truncateSafely(String(result), 500);
    }
  }

  function sanitizeForFormula(str) {
    return String(str).replace(/["\r\n]/g, '').trim();
  }

  async function getScratchSheet(context) {
    const sheets = context.workbook.worksheets;
    sheets.load("items/name");
    await context.sync();
    let sheet = sheets.items.find(s => s.name === SCRATCH_SHEET);
    if (!sheet) { sheets.add(SCRATCH_SHEET); await context.sync(); }
    return context.workbook.worksheets.getItem(SCRATCH_SHEET);
  }

  async function waitForValue(context, range, timeoutMs = 8000, intervalMs = 400) {
    const start = Date.now();
    let lastText = "";
    while (Date.now() - start < timeoutMs) {
      range.load("values,text");
      await context.sync();
      lastText = range.values;
      const flat = JSON.stringify(lastText);
      if (!flat.includes("Requesting") && !flat.includes("#N/A Requesting")) return lastText;
      await new Promise(r => setTimeout(r, intervalMs));
    }
    return lastText;
  }

  // 對 Excel 連續下好幾個指令時，底層偶爾會來不及反應、回報「活頁簿正在被鎖定」
  // 這種暫時性的一般性錯誤，通常多等一下重試就會自己過去，不是真正的邏輯錯誤。
  // 所有會實際操作 Excel 的呼叫都透過這個函數執行，自動重試最多 5 次、每次等更久一點才真的算失敗，
  // 目的是讓這個操作本身盡量真的成功，而不是讓使用者反覆看到「同一個錯誤又發生了」。
  async function runExcelWithRetry(taskFn, maxAttempts = 5) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        return await Excel.run(taskFn);
      } catch (e) {
        lastErr = e;
        if (attempt < maxAttempts) {
          await new Promise(r => setTimeout(r, 600 * attempt));
        }
      }
    }
    throw lastErr;
  }

  async function toolGetBloombergField(args) {
    return runExcelWithRetry(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow++;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDP("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}")`]];
      await context.sync();
      const value = await waitForValue(context, cell, 20000);
      const raw = value[0][0];
      const hasError = detectBloombergError(raw);
      return {
        ticker: args.ticker, field: args.field, value: raw, has_error: hasError,
        note: hasError ? "回傳內容看起來像錯誤或尚未完成讀取（例如代碼打錯、欄位不存在、或仍在向 Bloomberg 要資料）。請確認證券代碼與欄位代碼是否正確，必要時換一個欄位再試，不要直接把這個值當成真實資料使用。" : undefined
      };
    });
  }

  async function toolGetBloombergHistory(args) {
    return runExcelWithRetry(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow; scratchRow += 60;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDH("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}","${sanitizeForFormula(args.start_date)}","${sanitizeForFormula(args.end_date)}")`]];
      await context.sync();
      const resultRange = sheet.getRange(`A${row}:B${row + 55}`);
      const values = await waitForValue(context, resultRange, 25000);
      const rows = values.filter(r => r[0] !== "" && r[0] !== null);
      const hasError = rows.length === 0 || rows.some(r => detectBloombergError(r[0]) || detectBloombergError(r[1]));
      return {
        ticker: args.ticker, field: args.field, rows, has_error: hasError,
        note: hasError ? "查詢結果為空或包含錯誤標記，請確認代碼、欄位、日期區間是否正確。" : undefined
      };
    });
  }

  async function toolGetBloombergBulk(args) {
    return runExcelWithRetry(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow; scratchRow += 200;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDS("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}")`]];
      await context.sync();
      const resultRange = sheet.getRange(`A${row}:J${row + 195}`);
      const values = await waitForValue(context, resultRange, 25000);
      const rows = values.filter(r => r.some(v => v !== "" && v !== null));
      const hasError = rows.length === 0 || detectBloombergError(rows[0] && rows[0][0]);
      const truncated = rows.length > 50;
      return {
        ticker: args.ticker, field: args.field, row_count: rows.length,
        rows: rows.slice(0, 50), truncated, has_error: hasError,
        note: [
          hasError ? "查詢結果為空或包含錯誤標記，請確認代碼與欄位是否正確。" : null,
          truncated ? `結果共 ${rows.length} 列，這裡只回傳前 50 列供分析；完整資料仍寫在 AI_Scratch 工作表第 ${row} 列開始。` : null
        ].filter(Boolean).join(" ") || undefined
      };
    });
  }

  async function toolExplainFormula(args) {
    return runExcelWithRetry(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const cell = sheet.getRange(args.cell_address);
      cell.load("formulas,values,valueTypes");
      await context.sync();
      const formula = cell.formulas[0][0];
      return {
        cell_address: args.cell_address,
        formula: formula,
        is_formula: typeof formula === "string" && formula.startsWith("="),
        current_value: cell.values[0][0]
      };
    });
  }

  async function toolReadRange(args) {
    return runExcelWithRetry(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const range = sheet.getRange(args.range_address);
      range.load("values,rowCount,columnCount");
      await context.sync();

      // 選取範圍太大（例如整欄、上百列）會讓回傳資料塞爆對話的 token 預算，
      // 導致最後模型擠不出結論文字。這裡設一個保守的上限，超過就只回傳
      // 前面一部分並清楚告知已截斷，模型看到 truncated 應該主動建議使用者縮小範圍
      // 或改用 get_bloomberg_history / get_bloomberg_bulk 這類本身就有截斷保護的工具。
      const MAX_ROWS = 60;
      const totalRows = range.values.length;
      const truncated = totalRows > MAX_ROWS;
      const values = truncated ? range.values.slice(0, MAX_ROWS) : range.values;

      return {
        range: args.range_address,
        row_count: totalRows,
        column_count: range.columnCount,
        values,
        truncated,
        note: truncated
          ? `這個範圍共 ${totalRows} 列，資料量太大，這裡只回傳前 ${MAX_ROWS} 列。如果需要完整分析，建議請使用者縮小選取範圍，或分成幾次個別查詢。`
          : undefined
      };
    });
  }

  // 單一儲存格位址的格式驗證：只接受像 A1、AB12 這種單一儲存格，
  // 不接受 A1:C10 這種範圍——很多錯誤其實是模型把範圍傳進只吃單一儲存格的參數，
  // 先在這裡攔下來，直接給明確的修正方向，不要讓 Excel 丟出生硬的錯誤訊息。
  const SINGLE_CELL_PATTERN = /^[A-Za-z]{1,3}[0-9]{1,7}$/;
  function validateSingleCellAddress(address) {
    if (!SINGLE_CELL_PATTERN.test(String(address || '').trim())) {
      return `「${address}」不是有效的單一儲存格位址（需要像 A1、B12 這種格式，不能是 A1:C10 這種範圍，也不能包含工作表名稱）。`;
    }
    return null;
  }

  async function toolWriteToCell(args) {
    const addressError = validateSingleCellAddress(args.cell_address);
    if (addressError) return { error: addressError };

    return runExcelWithRetry(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const cell = sheet.getRange(args.cell_address);
      if (args.value.startsWith("=")) cell.formulas = [[args.value]];
      else cell.values = [[args.value]];

      cell.format.font.name = "微軟正黑體";
      if (args.style === "section_header") {
        cell.format.font.bold = true;
        cell.format.font.size = 13;
        cell.format.fill.color = "#D9E1F2";
      }

      await context.sync();

      cell.load("values,valueTypes");
      await context.sync();
      const isError = cell.valueTypes[0][0] === "Error";
      const resultValue = cell.values[0][0];

      return {
        written: true,
        cell_address: args.cell_address,
        actual_result: resultValue,
        has_error: isError,
        note: isError
          ? "公式計算結果是錯誤值，請檢查公式邏輯（例如 FILTER 找不到資料時需要加 if_empty 參數）並重新呼叫 write_to_cell 修正"
          : undefined
      };
    });
  }

  async function toolCreateWorksheet(args) {
    return runExcelWithRetry(async (context) => {
      const sheets = context.workbook.worksheets;
      sheets.load("items/name");
      await context.sync();
      const existed = sheets.items.some(s => s.name === args.sheet_name);
      if (!existed) { sheets.add(args.sheet_name); await context.sync(); }
      context.workbook.worksheets.getItem(args.sheet_name).activate();
      await context.sync();
      return { created: !existed, sheet_name: args.sheet_name };
    });
  }

  function colLetterToIndex(letters) {
    let n = 0;
    for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  function colIndexToLetter(index) {
    let n = index + 1, s = "";
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  async function toolWriteTable(args) {
    const addressError = validateSingleCellAddress(args.start_cell);
    if (addressError) return { error: `start_cell ${addressError}` };
    if (!Array.isArray(args.rows) || args.rows.length === 0) {
      return { error: "rows 必須是至少包含一列資料的二維陣列。" };
    }

    return runExcelWithRetry(async (context) => {
      const sheets = context.workbook.worksheets;
      sheets.load("items/name");
      await context.sync();
      if (!sheets.items.some(s => s.name === args.sheet_name)) { sheets.add(args.sheet_name); await context.sync(); }
      const targetSheet = context.workbook.worksheets.getItem(args.sheet_name);

      const nRows = args.rows.length;
      const nCols = Math.max(...args.rows.map(r => r.length));
      const normalized = args.rows.map(r => {
        const copy = r.slice();
        while (copy.length < nCols) copy.push("");
        return copy;
      });

      const startCol = args.start_cell.match(/[A-Z]+/)[0];
      const startRowNum = parseInt(args.start_cell.match(/\d+/)[0], 10);
      const endColIndex = colLetterToIndex(startCol) + nCols - 1;
      const endCol = colIndexToLetter(endColIndex);
      const endRowNum = startRowNum + nRows - 1;
      const fullRange = targetSheet.getRange(`${startCol}${startRowNum}:${endCol}${endRowNum}`);
      // 用 .formulas 而不是 .values：字串開頭是「=」的儲存格會被當成真正的公式計算，
      // 其他字串則照常當成一般文字/數字——之前用 .values 整批寫入，導致就算模型想輸出
      // 公式也沒辦法，一律被當成寫死的數字，這是這次修正的根本原因。
      fullRange.formulas = normalized;

      try {
        // Excel 中文版預設字型（新細明體）看起來比較舊式，整張表格統一改成「微軟正黑體」，
        // 跟我們面板本身的字體一致，看起來更現代、更整齊。
        fullRange.format.font.name = "微軟正黑體";

        const ACCENT_COLORS = {
          navy: "#0B3D62", teal: "#0F6E6E", plum: "#6B2D5C", forest: "#2E5E3E"
        };
        const accentColor = ACCENT_COLORS[args.accent] || ACCENT_COLORS.navy;

        const headerRange = targetSheet.getRange(`${startCol}${startRowNum}:${endCol}${startRowNum}`);
        headerRange.format.font.bold = true;
        headerRange.format.font.color = "white";
        headerRange.format.fill.color = accentColor;

        for (let r = 1; r < nRows; r++) {
          const rowNum = startRowNum + r;
          const rowRange = targetSheet.getRange(`${startCol}${rowNum}:${endCol}${rowNum}`);
          rowRange.format.fill.color = (r % 2 === 0) ? "#F5F9FF" : "#FFFFFF";
        }

        // 矩陣型交叉表（例如敏感度分析）：第一欄跟第一列一樣是分類標籤，不是資料本身，
        // 也套用標題樣式，讓人一眼看出橫軸縱軸在哪、資料交叉點在哪，不會跟一般清單表混淆。
        if (args.matrix_style) {
          const firstColRange = targetSheet.getRange(`${startCol}${startRowNum}:${startCol}${endRowNum}`);
          firstColRange.format.font.bold = true;
          firstColRange.format.font.color = "white";
          firstColRange.format.fill.color = accentColor;
        }

        // 資料格的數字格式：模型有指定 column_formats 就照指定的用（例如百分比、貨幣），
        // 沒指定的話依數值大小自動判斷——小於 1 的數字（利率、機率、d1/d2 這類）給 4 位小數，
        // 不會像之前那樣把 0.04659 這種利率砍成 0.05、資訊直接損失掉一大塊精確度。
        // 安全網：不管模型指定什麼格式，只要這一列第一欄的標籤文字看起來是利率／殖利率／
        // 波動率這類比率型指標，且數值本身在合理比率範圍內，強制套用百分比格式——
        // 避免模型自己選錯格式（例如把 3.86% 的殖利率標成 0.00 而不是 0.00%），
        // 讓使用者看到一個完全看不出意義的小數字。
        const RATE_KEYWORDS = ['殖利率', '利率', '波動率', '股息率', '折現率', '收益率'];
        if (nRows > 1) {
          const dataStartRow = startRowNum + 1;
          const dataRange = targetSheet.getRange(`${startCol}${dataStartRow}:${endCol}${endRowNum}`);
          const hasColumnFormats = Array.isArray(args.column_formats) && args.column_formats.length > 0;

          const formatGrid = normalized.slice(1).map(row => {
            const rowLabel = String(row[0] || '');
            const looksLikeRate = RATE_KEYWORDS.some(k => rowLabel.includes(k));
            return row.map((cellText, colIdx) => {
              const trimmed = String(cellText).trim();
              const isFormula = trimmed.startsWith("=");
              const numValue = Number(trimmed);
              const isNumeric = trimmed !== "" && !isNaN(numValue);

              let chosen;
              if (hasColumnFormats && args.column_formats[colIdx]) chosen = args.column_formats[colIdx];
              else if (!isFormula && !isNumeric) chosen = "General";
              else if (!isFormula && Math.abs(numValue) < 1 && numValue !== 0) chosen = "0.0000";
              else chosen = "#,##0.00";

              if (looksLikeRate && isNumeric && Math.abs(numValue) <= 2 && !String(chosen).includes('%')) {
                chosen = "0.00%";
              }
              return chosen;
            });
          });
          dataRange.numberFormat = formatGrid;

          const colorGrid = normalized.slice(1).map(row =>
            row.map((cellText) => {
              const trimmed = String(cellText).trim();
              const isFormula = trimmed.startsWith("=");
              const isNumeric = trimmed !== "" && !isNaN(Number(trimmed));
              return (!isFormula && isNumeric) ? "#1F4E96" : "#161B22";
            })
          );
          // 矩陣表的第一欄已經套過白字＋深藍底的標題樣式，這裡的黑／藍字判斷要跳過它，
          // 不然會把剛設好的白字蓋回黑字，變成深藍底配黑字看不清楚。
          const skipFirstCol = !!args.matrix_style;
          const colorDataRange = skipFirstCol
            ? targetSheet.getRange(`${colIndexToLetter(colLetterToIndex(startCol) + 1)}${dataStartRow}:${endCol}${endRowNum}`)
            : dataRange;
          colorDataRange.format.font.color = "#161B22"; // 先把資料範圍設成預設黑字，再把輸入值覆蓋成藍字
          for (let r = 0; r < colorGrid.length; r++) {
            for (let c = (skipFirstCol ? 1 : 0); c < colorGrid[r].length; c++) {
              if (colorGrid[r][c] === "#1F4E96") {
                const cellRef = targetSheet.getRange(`${colIndexToLetter(colLetterToIndex(startCol) + c)}${dataStartRow + r}`);
                cellRef.format.font.color = "#1F4E96";
              }
            }
          }
        }

        const borderSides = ["EdgeTop", "EdgeBottom", "EdgeLeft", "EdgeRight", "InsideHorizontal", "InsideVertical"];
        borderSides.forEach(side => {
          const b = fullRange.format.borders.getItem(side);
          b.style = "Continuous";
          b.color = "#DDE3EA";
          b.weight = "Thin";
        });

        // 自己依實際文字長度算出每欄合理的寬度，不依賴 autofitColumns()——
        // 這個 API 透過程式呼叫寫入時常常算不準，尤其中英文混排的欄位容易大小抓錯，
        // 導致像「有些欄位文字很長卻維持在很窄的預設寬度」這種情況。
        // 中文字視為兩個字元寬、公式儲存格因為看不到計算結果，用一個保守的固定寬度估計。
        const MAX_COL_WIDTH = 45;
        for (let c = 0; c < nCols; c++) {
          let maxLen = 0;
          normalized.forEach(row => {
            const cellText = String(row[c] || '');
            const len = cellText.startsWith('=')
              ? 8
              : Array.from(cellText).reduce((sum, ch) => sum + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
            if (len > maxLen) maxLen = len;
          });
          const colLetter = colIndexToLetter(colLetterToIndex(startCol) + c);
          const colRange = targetSheet.getRange(`${colLetter}${startRowNum}:${colLetter}${endRowNum}`);
          const width = Math.min(Math.max(maxLen * 1.9 + 4, 8), MAX_COL_WIDTH);
          colRange.format.columnWidth = width;
          if (width >= MAX_COL_WIDTH) colRange.format.wrapText = true;
        }

        // 表格夠大（超過一個螢幕高，或欄位夠多）時凍結窗格，往下往右捲動時
        // 標題列／標題欄還看得到，資料越複雜這個幫助越明顯。只在表格從 A1 開始時做，
        // 避免跟工作表裡其他已存在的內容衝突。
        if (args.start_cell === "A1" && (nRows > 15 || nCols > 6)) {
          if (args.matrix_style && nCols > 1) {
            targetSheet.freezePanes.freezeAt(targetSheet.getRange(`${colIndexToLetter(colLetterToIndex(startCol) + 1)}${startRowNum + 1}`));
          } else {
            targetSheet.freezePanes.freezeRows(1);
          }
        }
      } catch (styleErr) {
        // 樣式套用失敗不影響資料本身已經寫入成功，安靜略過即可
      }

      targetSheet.activate();
      await context.sync();
      return { written: true, sheet_name: args.sheet_name, range: `${args.start_cell}:${endCol}${endRowNum}` };
    });
  }

  const ALLOWED_CHART_TYPES = new Set([
    "ColumnClustered", "BarClustered", "Line", "Pie", "Area", "XYScatter", "XYScatterSmooth", "Doughnut"
  ]);

  async function toolCreateChart(args) {
    if (!ALLOWED_CHART_TYPES.has(args.chart_type)) {
      return { error: `不支援的圖表類型「${args.chart_type}」，請用以下其中一種：${[...ALLOWED_CHART_TYPES].join('、')}` };
    }
    if (args.anchor_cell) {
      const addressError = validateSingleCellAddress(args.anchor_cell);
      if (addressError) return { error: `anchor_cell ${addressError}` };
    }

    return runExcelWithRetry(async (context) => {
      const targetSheet = context.workbook.worksheets.getItem(args.sheet_name);
      const dataRange = targetSheet.getRange(args.data_range);
      const chart = targetSheet.charts.add(args.chart_type, dataRange, Excel.ChartSeriesBy.auto);

      // 基本的美化設定：標題、圖例位置、軸標題，讓輸出的圖表至少有基本的專業感，
      // 不是 Excel 預設那種毫無標示的空白圖表。
      if (args.title) {
        chart.title.text = args.title;
        chart.title.visible = true;
      }
      chart.legend.position = Excel.ChartLegendPosition.bottom;
      chart.legend.visible = true;

      try {
        if (args.x_axis_title) {
          const catAxis = chart.axes.categoryAxis;
          catAxis.title.text = args.x_axis_title;
          catAxis.title.visible = true;
        }
        if (args.y_axis_title) {
          const valAxis = chart.axes.valueAxis;
          valAxis.title.text = args.y_axis_title;
          valAxis.title.visible = true;
        }
      } catch (axisErr) {
        // 不是每種圖表類型都有 X/Y 軸（例如圓餅圖），設定失敗就略過，不影響圖表本身
      }

      // 決定圖表放在哪裡：使用者有指定就照指定的位置，沒有的話自動放在資料範圍下方，
      // 避免蓋住原本的資料。
      let anchorCol, anchorRow;
      if (args.anchor_cell) {
        anchorCol = args.anchor_cell.match(/[A-Za-z]+/)[0];
        anchorRow = parseInt(args.anchor_cell.match(/\d+/)[0], 10);
      } else {
        const rangeMatch = args.data_range.match(/^([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)$/);
        if (rangeMatch) {
          anchorCol = rangeMatch[1];
          anchorRow = parseInt(rangeMatch[4], 10) + 2;
        }
      }
      if (anchorCol && anchorRow) {
        const topLeft = targetSheet.getRange(`${anchorCol}${anchorRow}`);
        chart.setPosition(topLeft, null);
      }

      targetSheet.activate();
      await context.sync();
      return { created: true, sheet_name: args.sheet_name, chart_type: args.chart_type, data_range: args.data_range };
    });
  }

  function describeToolCall(name, args) {
    args = args || {};
    switch (name) {
      case "get_bloomberg_field": return `查詢 Bloomberg：${args.ticker || '?'} 的 ${args.field || '?'}`;
      case "get_bloomberg_history": return `查詢 Bloomberg 歷史資料：${args.ticker || '?'} 的 ${args.field || '?'}（${args.start_date || '?'} ~ ${args.end_date || '?'}）`;
      case "get_bloomberg_bulk": return `查詢 Bloomberg 批次資料：${args.ticker || '?'} 的 ${args.field || '?'}`;
      case "read_range": return `讀取工作表範圍：${args.range_address || '?'}`;
      case "explain_formula": return `解釋儲存格 ${args.cell_address || '?'} 的公式`;
      case "write_to_cell": return `寫入儲存格 ${args.cell_address || '?'}：${args.value || ''}`;
      case "create_worksheet": return `建立/切換工作表：${args.sheet_name || '?'}`;
      case "write_table": return `寫入表格到「${args.sheet_name || '?'}」（${(args.rows && args.rows.length) || 0} 列${args.matrix_style ? '，矩陣樣式' : ''}）`;
      case "create_chart": return `在「${args.sheet_name || '?'}」插入 ${args.chart_type || '?'} 圖表（資料來源 ${args.data_range || '?'}）`;
      default: return name;
    }
  }

  function summarizeToolResult(name, args, result) {
    if (result && result.error) return '執行失敗：' + result.error;
    switch (name) {
      case "get_bloomberg_field":
        return result.has_error
          ? `查詢 ${args.ticker} 的 ${args.field} 時似乎出錯或查無資料`
          : `${args.ticker} 的 ${args.field}：${result.value}`;
      case "write_to_cell":
        return result.written
          ? (result.has_error ? `已寫入 ${args.cell_address}，但公式算出錯誤值` : `已寫入 ${args.cell_address}`)
          : `未寫入（${result.reason || '使用者取消'}）`;
      case "create_worksheet":
        return result.created ? `已建立工作表「${args.sheet_name}」` : `已切換到工作表「${args.sheet_name}」`;
      case "write_table":
        return result.written ? `已寫入表格到「${args.sheet_name}」（${result.range}）` : `未寫入（${result.reason || '使用者取消'}）`;
      case "create_chart":
        return result.created ? `已在「${args.sheet_name}」插入 ${args.chart_type} 圖表` : `未插入圖表（${result.reason || '使用者取消'}）`;
      case "read_range":
        return `已讀取 ${args.range_address} 的內容`;
      case "explain_formula":
        return result.is_formula ? `${args.cell_address} 的公式：${result.formula}` : `${args.cell_address} 目前不是公式，值為 ${result.current_value}`;
      default:
        return describeToolCall(name, args);
    }
  }

  async function executeTool(name, args) {
    switch (name) {
      case "get_bloomberg_field": return toolGetBloombergField(args);
      case "get_bloomberg_history": return toolGetBloombergHistory(args);
      case "get_bloomberg_bulk": return toolGetBloombergBulk(args);
      case "read_range": return toolReadRange(args);
      case "explain_formula": return toolExplainFormula(args);
      case "write_to_cell": return toolWriteToCell(args);
      case "create_worksheet": return toolCreateWorksheet(args);
      case "write_table": return toolWriteTable(args);
      case "create_chart": return toolCreateChart(args);
      default: return { error: `未知的工具：${name}` };
    }
  }

  // ============================================================
  // 核心：多輪工具呼叫迴圈
  // ============================================================
  let currentAbortController = null;
  // 複雜任務（多個工具呼叫、大量推理）單次請求可能需要好幾分鐘，拉長到 5 分鐘。
  const REQUEST_TIMEOUT_MS = 300000;

  function stopCurrentRequest() {
    if (currentAbortController) currentAbortController.abort();
  }

  async function callModel(payload, attempt = 1) {
    const key = document.getElementById('apiKey').value.trim();
    currentAbortController = new AbortController();
    const timeoutId = setTimeout(() => currentAbortController.abort(), REQUEST_TIMEOUT_MS);

    // 等待期間讓「思考中」順便顯示已經等了幾秒，讓使用者知道還在跑、不是卡死了，
    // 尤其這種可能要等一兩分鐘的複雜任務，沒有任何回饋會讓人以為當掉了。
    const waitStart = Date.now();
    const elapsedTimer = setInterval(() => {
      const secs = Math.floor((Date.now() - waitStart) / 1000);
      setThinkingText(`回應中... ${secs}s`);
    }, 3000);

    let resp;
    try {
      resp = await fetch(CGU_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: currentAbortController.signal
      });
    } catch (e) {
      clearTimeout(timeoutId);
      clearInterval(elapsedTimer);
      if (e.name === 'AbortError') {
        throw new Error(`請求已中斷（可能是逾時超過 ${REQUEST_TIMEOUT_MS / 1000} 秒未回應，或你按了停止）`);
      }
      // 網路瞬斷（例如 Failed to fetch）值得重試，跟 429/5xx 用同一套重試邏輯，
      // 不要一次網路不穩就直接放棄整個請求。
      if (attempt <= 3) {
        await new Promise(r => setTimeout(r, attempt * 1000));
        return callModel(payload, attempt + 1);
      }
      throw new Error('網路連線失敗（已重試 3 次）：' + e.message);
    }
    clearTimeout(timeoutId);
    clearInterval(elapsedTimer);

    if ((resp.status === 429 || resp.status >= 500) && attempt <= 3) {
      await new Promise(r => setTimeout(r, attempt * 1200));
      return callModel(payload, attempt + 1);
    }

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error ? data.error.message : ('HTTP ' + resp.status));
    return data;
  }

  function getSelectionContextNote() {
    if (excludeSelectionContext || !lastSelectionInfo) return "";
    return `【目前 Excel 狀態】目前作用中工作表：${lastSelectionInfo.sheetName}｜` +
      `目前選取範圍：${lastSelectionInfo.address}｜選取內容預覽（最多 8x8）：${JSON.stringify(lastSelectionInfo.previewRows)}`;
  }

  function looksLikeDanglingCallError(message) {
    const m = (message || "").toLowerCase();
    return (m.includes("tool") && (m.includes("output") || m.includes("call"))) ||
           m.includes("function_call") || m.includes("no tool output");
  }

  // 當模型沒有回傳任何文字內容時，與其顯示籠統的「沒有收到文字回覆」，
  // 檢查 API 回傳的狀態，能講出具體原因（最常見：回覆因為長度上限被截斷）就講清楚，
  // 讓使用者知道該怎麼調整（縮小範圍、拆成幾個問題），而不是不明所以地卡住。
  function explainEmptyReply(data) {
    if (data && data.status === 'incomplete') {
      const reason = data.incomplete_details && data.incomplete_details.reason;
      if (reason === 'max_output_tokens') {
        return '這次要分析的資料量比較大，回覆內容超過長度上限被截斷了，沒能產生完整結論。建議縮小分析範圍（例如只看一個年份、一個分類，或選取範圍小一點），或把問題拆成幾個較小的問題分開問。';
      }
      return `這次的回覆被提前中止了（原因：${reason || '未知'}），沒能產生完整內容，建議換個方式重新提問一次。`;
    }
    return '模型這次沒有回傳任何文字內容，可能是暫時性問題，建議重新問一次；如果同樣的問題重複發生，很可能是這次牽涉的資料量太大，建議縮小範圍再試。';
  }

  // 組出送給 API 的 input：純文字時是字串；有附加圖片時要組成多模態內容陣列。
  // 支援多個檔案：多個文字檔會依序合併進同一段文字，多張圖片會各自成為一個
  // input_image 區塊，讓模型一次看到全部。
  function buildApiInput(text, contextNote, files) {
    let combinedText = text;
    const textFiles = (files || []).filter(f => f.kind === 'text');
    const imageFiles = (files || []).filter(f => f.kind === 'image');

    if (textFiles.length > 0) {
      const attachmentsBlock = textFiles
        .map(f => `【附加檔案：${f.name}】\n${f.content}\n【附加檔案結束】`)
        .join('\n\n');
      combinedText = `${attachmentsBlock}\n\n${combinedText}`;
    }
    if (contextNote) combinedText = `${contextNote}\n\n使用者的問題：${combinedText}`;

    if (imageFiles.length > 0) {
      const content = [{ type: "input_text", text: combinedText }];
      imageFiles.forEach(f => content.push({ type: "input_image", image_url: f.dataUri }));
      return [{ role: "user", content }];
    }
    return combinedText;
  }

  async function sendMessage() {
    const key = document.getElementById('apiKey').value.trim();
    const text = userInput.value.trim();
    if (!key) { addMessage('system', '請先在上面輸入你的 CGU API Key 並按「連線」'); return; }
    if (!text) return;

    const attachmentNote = attachedFiles.length > 0
      ? `\n\n[已附加：${attachedFiles.map(f => f.name).join('、')}]`
      : '';
    addMessage('user', text + attachmentNote);
    userInput.value = '';
    autoResizeTextarea();
    sendBtn.disabled = true;
    document.getElementById('stopBtn').style.display = 'inline-block';
    setThinkingText('回應中...');
    const model = getSelectedModel();
    const filesForThisTurn = attachedFiles;
    filesForThisTurn.forEach(f => {
      if (!conversationAttachments.includes(f.name)) conversationAttachments.push(f.name);
    });
    if (filesForThisTurn.length > 0) renderConversationAttachmentsBar();

    try {
      const contextNote = getSelectionContextNote();
      const apiInput = buildApiInput(text, contextNote, filesForThisTurn);

      let payload = {
        model, input: apiInput,
        instructions: previousResponseId ? undefined : SYSTEM_INSTRUCTIONS,
        tools: TOOLS, max_output_tokens: 9000
      };
      if (previousResponseId) payload.previous_response_id = previousResponseId;

      // 偵測「同一個工具呼叫、同樣的錯誤」連續重複發生——代表卡在一個模型自己
      // 解決不了的環境問題（例如儲存格還在編輯模式），與其讓它盲目重試到第 6 輪，
      // 不如提早停下來，直接把問題講清楚給使用者聽。
      const failureSignatureCounts = {};
      let stoppedDueToRepeatedFailure = null;
      const MAX_TOOL_ROUNDS = 6;
      let round = 0;

      // 整個問題（可能橫跨好幾輪工具呼叫）累積下來實際用到的資料來源，
      // 最後會顯示在回覆下方，跟過程中的步驟清單分開、不會被清掉。
      const turnBloombergSources = [];
      const turnWebSources = [];

      // 用 while 迴圈取代原本固定 6 次的 for 迴圈，關鍵差異是：
      // 到達輪數上限時，「這一輪算好的工具結果」一定會先送出去（伺服器要求每個
      // 工具呼叫都要有對應的輸出，不能就這樣放著不管），只是同時拿掉 tools 參數，
      // 逼模型這一輪只能用文字收尾、不能再要求呼叫新工具——不會再出現「還有未結清
      // 的工具呼叫，卻另外開了一個不相關的收尾請求」這種懸而未決的狀況。
      while (round <= MAX_TOOL_ROUNDS) {
        const data = await callModel(payload);
        previousResponseId = data.id;

        const functionCalls = (data.output || []).filter(i => i.type === "function_call");
        const webSearchCalls = (data.output || []).filter(i => i.type === "web_search_call");
        const messages = (data.output || []).filter(i => i.type === "message");

        if (functionCalls.length === 0) {
          let replyText = null;
          for (const m of messages) for (const c of (m.content || [])) {
            if (c.type === "output_text") {
              replyText = c.text;
              (c.annotations || []).forEach(a => {
                if (a.type === "url_citation" && a.url) turnWebSources.push({ url: a.url, title: a.title });
              });
            }
          }
          if (!replyText) replyText = explainEmptyReply(data);
          await typewriterReveal(replyText, turnBloombergSources, turnWebSources);
          return;
        }

        round++;

        const parsedCalls = functionCalls.map(fc => {
          let args = null, parseError = null;
          try { args = JSON.parse(fc.arguments || "{}"); }
          catch (e) {
            // 給模型看得懂、能自己修正的錯誤說明，而不是單純講「格式不對」——
            // 常見原因是單一次呼叫塞了太多資料，講清楚可以怎麼分批處理。
            parseError = "上一次呼叫的參數不是合法的 JSON，很可能是這次要處理的資料量太大、" +
              "在產生參數時被截斷或格式跑掉。請把資料拆成較小的批次重新嘗試" +
              "（例如 write_table 一次不要超過 20-30 列，資料多的話分成好幾次呼叫，" +
              "並確認每次呼叫的 JSON 陣列/物件括號都有正確閉合）。";
          }
          return { fc, args: args || {}, parseError };
        });

        // 統一的「Accept All Edits」：這一輪只要有寫入動作（不論一個還是多個），
        // 一律先跳一次確認視窗（或直接套用本次對話已勾選的自動允許），允許了才會真的去執行。
        const writeCalls = parsedCalls.filter(p => WRITE_TOOL_NAMES.has(p.fc.name) && !p.parseError);
        let writesApproved = true;
        if (writeCalls.length > 0) {
          setThinkingText('等待你確認寫入動作');
          writesApproved = await confirmWrites(writeCalls.map(p => ({ name: p.fc.name, _args: p.args })));
        }

        const toolOutputs = [];
        const roundResultsForDisplay = [];

        for (const ws of webSearchCalls) {
          const q = ws.action && (ws.action.query || (ws.action.queries || []).join('、'));
          roundResultsForDisplay.push({
            icon: '🔍',
            summary: '已搜尋網路' + (q ? '：' + q : ''),
            detail: JSON.stringify(ws.action || {}),
            isError: false
          });
        }

        for (const { fc, args, parseError } of parsedCalls) {
          let result;
          let description = "(無法解析的工具呼叫)";
          try { description = describeToolCall(fc.name, args); } catch (e) { /* 用預設值 */ }

          if (parseError) {
            result = { error: parseError };
          } else if (WRITE_TOOL_NAMES.has(fc.name) && !writesApproved) {
            result = { written: false, reason: "使用者取消了本批寫入動作" };
          } else {
            setThinkingText('執行中：' + description);
            try {
              result = await executeTool(fc.name, args);
            } catch (e) {
              result = { error: friendlyExcelError(e) };
            }
          }

          const errorText = result && (result.error || (result.written === false && result.reason) || (result.has_error && result.note));
          if (errorText) {
            const sig = fc.name + '|' + JSON.stringify(args) + '|' + errorText;
            failureSignatureCounts[sig] = (failureSignatureCounts[sig] || 0) + 1;
            if (failureSignatureCounts[sig] >= 2 && !stoppedDueToRepeatedFailure) {
              stoppedDueToRepeatedFailure = errorText;
            }
          } else if (["get_bloomberg_field", "get_bloomberg_history", "get_bloomberg_bulk"].includes(fc.name) && args.ticker && args.field) {
            turnBloombergSources.push({ ticker: args.ticker, field: args.field });
          }

          let summary = "?";
          try { summary = summarizeToolResult(fc.name, args, result); } catch (e) { summary = description; }
          roundResultsForDisplay.push({
            icon: iconForToolName(fc.name),
            summary, detail: formatToolResultForDisplay(result), isError: !!errorText
          });

          toolOutputs.push({ type: "function_call_output", call_id: fc.call_id, output: JSON.stringify(result) });
        }

        try { commitSteps(roundResultsForDisplay); } catch (e) { /* 顯示失敗不影響 API 合約，安靜略過 */ }

        if (stoppedDueToRepeatedFailure) {
          finishActivityLog();
          addMessage('system', `偵測到同一個錯誤連續發生，已停止重複嘗試：${stoppedDueToRepeatedFailure}\n\n這通常需要你先手動處理（例如按 Enter 或 Tab 離開儲存格編輯模式）才能繼續，處理好之後可以再問一次。`);
          return;
        }

        const hitLimit = round >= MAX_TOOL_ROUNDS;
        if (hitLimit) {
          // 一定要把這輪的工具結果送出去，同時附上一句要求收尾的說明，
          // 並且拿掉 tools 參數，讓這次的回應只能是文字，不能再要求呼叫工具。
          payload = {
            model, previous_response_id: previousResponseId,
            input: [
              ...toolOutputs,
              { role: "user", content: "已達到本次工具呼叫次數上限，請不要再嘗試呼叫任何工具，直接根據目前為止已經取得的所有資料，給出你能給出的最佳結論、分析或摘要，並說明還有哪些資訊尚未查到。" }
            ],
            max_output_tokens: 9000
            // 注意：這裡刻意不帶 tools
          };
        } else {
          payload = { model, previous_response_id: previousResponseId, input: toolOutputs, tools: TOOLS, max_output_tokens: 9000 };
        }
        setThinkingText('回應中...');
      }

      // 理論上不該走到這裡（到達上限那輪已經拿掉 tools，逼模型只能用文字收尾），
      // 這裡純粹是保底，避免真的發生意外狀況時卡住沒有任何回應。
      finishActivityLog();
      addMessage('system', '對話處理超過預期的輪數，請重新描述你的問題再試一次。');
    } catch (e) {
      finishActivityLog();
      if (looksLikeDanglingCallError(e.message)) {
        previousResponseId = null;
        conversationAttachments = [];
        autoApproveWritesThisConversation = false;
        updateAutoApproveButton();
        renderConversationAttachmentsBar();
        addMessage('system', '偵測到對話狀態異常（伺服器回報有未完成的工具呼叫），已自動重新開始對話。先前附加過的檔案內容也一併清空了，如果還需要參考，請重新附加一次。');
      } else if (e.message.includes('請求已中斷')) {
        // 逾時通常代表這次任務規模太大、模型在單次回應裡想做的事情太多。
        // 講清楚可能原因跟建議，而不是只丟一句技術性的「請求已中斷」。
        addMessage('system', e.message + '\n\n上面步驟清單裡如果已經有完成的動作，那些內容已經真的寫進你的活頁簿了，不會遺失。' +
          '如果同樣的問題重複發生，很可能是這次要求的任務一次牽涉太多步驟（例如好幾張大表格、好幾輪查詢），' +
          '建議拆成兩三個較小的問題分開問，會比一次塞給它更穩定。');
      } else {
        addMessage('system', '發生錯誤：' + e.message, { autoFade: true });
      }
    } finally {
      sendBtn.disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      currentAbortController = null;
      attachedFiles = [];
      renderAttachmentChip();
    }
  }

  Office.onReady(() => {
    addMessage('system', '請貼上你的 CGU API Key 並按「連線」開始使用。');
    refreshSelectionInfo();
    setupSelectionListener();
  });
</script>
