<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>CGU API Key</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.17.0/contrib/auto-render.min.js"></script>
<style>
  :root {
    --navy: #0b3d62;
    --navy-dark: #082b45;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #dde3ea;
    --text: #161b22;
    --text-dim: #5b6673;
    --data-bg: #eef3f8;
    --data-text: #0b3d62;
    --ok: #0f7b4d;
    --warn: #a15c00;
    --err: #b3261e;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 13.5px;
  }
  body { display: flex; flex-direction: column; padding: 10px; gap: 8px; }

  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 8px; border-bottom: 2px solid var(--navy);
  }
  .header h1 { font-size: 16px; font-weight: 700; margin: 0; color: var(--navy-dark); }
  .header .version { font-size: 10px; color: var(--text-dim); font-family: var(--mono); }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px;
  }

  .row { display: flex; gap: 6px; align-items: center; }
  .row + .row { margin-top: 6px; }
  label.field-label { font-size: 11px; color: var(--text-dim); min-width: 56px; }

  input[type=password], input[type=text], select {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-family: var(--mono); font-size: 12px; background: #fcfdfe; color: var(--text);
  }
  select { font-family: var(--sans); }

  button.btn {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--navy);
    background: var(--navy); color: white; cursor: pointer; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  button.btn:hover { background: var(--navy-dark); }
  button.btn.ghost { background: transparent; color: var(--navy); }
  button.btn.icon { padding: 6px 9px; }
  button.btn:disabled { background: #b9c6d4; border-color: #b9c6d4; cursor: not-allowed; }

  .key-status { font-size: 11px; font-family: var(--mono); min-height: 14px; }
  .key-status.ok { color: var(--ok); }
  .key-status.bad { color: var(--err); }

  .model-toggle { font-size: 10.5px; color: var(--navy); cursor: pointer; text-decoration: underline; margin-top: 4px; display: inline-block; }

  /* 選取範圍列：仿照參考截圖，整條淺灰底、單行文字 + 右側 X，不做成小圓角標籤 */
  .selection-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #f0f2f5; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--text-dim);
  }
  .selection-bar button {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 14px; line-height: 1;
  }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--data-bg); color: var(--data-text);
    border: 1px solid #c9dcee; border-radius: 999px;
    padding: 3px 6px 3px 10px; font-size: 11px; font-family: var(--mono);
  }
  .chip button {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px;
  }

  #chatBox {
    flex: 1; min-height: 200px;
    border: 1px solid var(--border); border-radius: 8px;
    overflow-y: auto; padding: 10px; background: var(--panel);
    display: flex; flex-direction: column; gap: 8px;
  }

  .msg { max-width: 94%; }
  .msg.user { align-self: flex-end; }
  .msg.ai, .msg.system, .msg.tool { align-self: flex-start; }

  .bubble {
    padding: 7px 11px; border-radius: 10px; word-break: break-word; line-height: 1.55;
  }
  .msg.user .bubble { background: var(--navy); color: white; border-bottom-right-radius: 3px; white-space: pre-wrap; }
  .msg.ai .bubble { background: #eef1f4; color: var(--text); border-bottom-left-radius: 3px; position: relative; }
  .msg.ai .bubble p:first-child { margin-top: 0; }
  .msg.ai .bubble p:last-child { margin-bottom: 0; }
  .msg.ai .bubble table { border-collapse: collapse; font-size: 12px; margin: 6px 0; }
  .msg.ai .bubble th, .msg.ai .bubble td { border: 1px solid var(--border); padding: 3px 6px; }
  .msg.ai .bubble code { background: var(--data-bg); padding: 1px 4px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }
  .msg.ai .bubble pre { background: var(--data-bg); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .msg.system .bubble {
    background: #fff8e8; color: var(--warn); font-size: 11.5px;
    border: 1px dashed #e8d5a0; white-space: pre-wrap;
  }
  .msg.tool .bubble {
    background: var(--data-bg); color: var(--data-text);
    font-size: 11.5px; border-left: 3px solid var(--navy);
    border-radius: 4px; white-space: pre-wrap;
  }
  .msg.tool .bubble .tool-summary { font-weight: 600; font-family: var(--sans); }
  .msg.tool .bubble .tool-toggle {
    font-size: 10px; color: var(--text-dim); cursor: pointer; text-decoration: underline;
    font-family: var(--sans); margin-top: 3px; display: inline-block;
  }
  .msg.tool .bubble .tool-detail {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 4px; display: none;
  }
  .msg.tool .bubble .tool-detail.open { display: block; }

  .copy-btn {
    position: absolute; top: 4px; right: 4px; font-size: 10px;
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    opacity: 0; transition: opacity 0.15s;
  }
  .msg.ai:hover .copy-btn { opacity: 1; }

  .thinking-dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--warn); margin-right: 3px;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-row { display: flex; gap: 6px; align-items: flex-end; }
  .input-row textarea {
    flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    resize: none; font-family: var(--sans); font-size: 13px; background: var(--panel);
    max-height: 160px; overflow-y: auto; line-height: 1.4;
  }

  .footer-note { font-size: 10.5px; color: var(--text-dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
  .footer-note a { color: var(--navy); cursor: pointer; text-decoration: none; font-weight: 600; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(11,61,98,0.35); z-index: 9999;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: #fff; border-radius: 10px; padding: 16px; max-width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); font-family: var(--sans);
  }
  .modal-msg { white-space: pre-wrap; font-size: 12.5px; color: var(--text); margin-bottom: 12px; line-height: 1.5; max-height: 50vh; overflow-y: auto; }
  .modal-btn-row { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
  <div class="header">
    <h1>CGU API Key</h1>
    <span class="version" id="versionTag"></span>
  </div>

  <div class="panel">
    <div class="row">
      <label class="field-label">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
      <button class="btn ghost" onclick="testKey()">連線</button>
    </div>
    <div id="keyStatus" class="key-status"></div>
    <div class="row">
      <label class="field-label">模型</label>
      <select id="modelSelect"><option value="">先連線以載入模型清單</option></select>
    </div>
    <span class="model-toggle" id="modelToggle" onclick="toggleModelListMode()" style="display:none;">顯示所有版本</span>
  </div>

  <div id="selectionBarWrap"></div>
  <div class="chip-row" id="attachmentChipRow"></div>

  <div id="chatBox"></div>

  <div class="input-row" style="position:relative;">
    <input type="file" id="fileAttach" style="display:none" accept=".txt,.csv,.json,.md,.tsv,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp" />
    <button class="btn ghost icon" title="附加檔案" onclick="document.getElementById('fileAttach').click()">📎</button>
    <textarea id="userInput" rows="1" placeholder="例如：幫我分析台積電的選擇權"></textarea>
    <button class="btn" id="sendBtn" onclick="sendMessage()">送出</button>
    <button class="btn ghost" id="stopBtn" onclick="stopCurrentRequest()" style="display:none;">停止</button>
  </div>
  <div class="footer-note">
    <span>Enter 送出，Shift+Enter 換行</span>
    <span>
      <a onclick="resetConversation()">開新對話</a>
      　<a id="reportLink" href="#">回報問題</a>
    </span>
  </div>

<script>
  // ============================================================
  // 基本設定
  // ============================================================
  const APP_VERSION = "v3.4";
  const REPORT_EMAIL = "b1245031@cgu.edu.tw";
  document.getElementById('versionTag').textContent = APP_VERSION;
  document.getElementById('reportLink').href =
    'mailto:' + REPORT_EMAIL +
    '?subject=' + encodeURIComponent('CGU API Key 增益集問題回報（' + APP_VERSION + '）') +
    '&body=' + encodeURIComponent('請描述你遇到的狀況（可以附上截圖另外寄）：\n\n\n---\n版本：' + APP_VERSION);

  // PDF / Word 解析改由後端負責（見 extract.py），不再依賴瀏覽器端的 CDN 函式庫
  const EXTRACT_API_URL = "https://excel-ai-addin-nu.vercel.app/api/extract";

  let previousResponseId = null;
  const SCRATCH_SHEET = "AI_Scratch";
  let scratchRow = 1;

  const CGU_ROOT = "https://air.cgu.edu.tw/cgullmapi/v1";
  const CGU_URL = CGU_ROOT + "/responses";
  const MODELS_URL = CGU_ROOT + "/models";

  let excludeSelectionContext = false;
  let attachedFile = null; // { name, kind: 'text'|'image', content?, dataUri? }
  let allModelIds = [];
  let showAllModels = false;

  function getSelectedModel() {
    const sel = document.getElementById('modelSelect');
    return sel.value || "gpt-5.4-mini";
  }

  const SYSTEM_INSTRUCTIONS =
    "你是嵌入在 Excel 裡的財務分析助手，服務對象是財務工程課程的學生。" +
    "使用者的問題可能需要查詢 Bloomberg 即時或歷史資料才能回答，" +
    "遇到這種情況請務必呼叫對應的工具取得真實資料，不要憑猜測回答。" +
    "如果問題需要最新的網路資訊（例如新聞、時事、非 Bloomberg 涵蓋的資料），可以使用網頁搜尋工具。" +
    "如果使用者附加了圖片，請根據圖片實際內容回答，不要憑空想像圖片裡有什麼。" +
    "如果使用者附加了 PDF 或 Word 文件，內容已經被轉換成純文字附加在訊息裡（可能因為掃描檔而擷取不到文字，" +
    "如果附加內容看起來是空的或亂碼，請直接告訴使用者可能是掃描檔無法擷取文字，不要編造內容）。" +
    "如果分析結果是一張表格（例如選擇權鏈、多期限比較），優先呼叫 create_worksheet " +
    "建立新的工作表、再用 write_table 把整張表寫進去，不要把大量資料塞進單一儲存格或直接貼在聊天回覆裡。" +
    "write_table 寫入時系統會自動套用專業報表樣式（標題列、斑馬紋、格線），你只需要專注在資料內容本身正確即可，" +
    "除非使用者特別要求（例如「不要顏色」「要列印用的簡單版」），才需要另外調整。" +
    "每則使用者訊息前面可能會附上【目前 Excel 狀態】這段自動產生的上下文（目前選取範圍、內容預覽），" +
    "這是系統自動提供的、不是使用者手打的，可以直接參考來理解使用者在看哪裡，不需要每次都重新呼叫 read_range 確認。" +
    "如果使用者問「這格怎麼算的」「解釋這個公式」，用 explain_formula 工具查看實際公式再回答，不要憑猜測。" +
    "回覆時善用 Markdown 格式（粗體、清單、表格）讓內容清楚易讀，但不要過度使用標題階層，保持像正常對話。" +
    "數字請維持一致的格式：大數字加千分位逗號、百分比加上 % 符號、" +
    "小數位數不要忽多忽少（例如同一份分析裡的百分比統一取到小數點後一到二位）。" +
    "所有回覆一律使用繁體中文，語氣專業但易懂，適合財金系學生閱讀，避免不必要的贅字或重複確認。" +
    "分析選擇權、期貨等衍生性商品時，請簡要說明數字背後的意義，不要只丟數字。" +
    "使用 write_to_cell 寫入公式時要考慮邊界情況：FILTER 等動態陣列函數若可能找不到符合資料，" +
    "務必加上 if_empty 參數（例如 FILTER(範圍,條件,\"查無資料\")），避免產生 #CALC! 錯誤。" +
    "write_to_cell 執行後會回傳實際算出的結果，如果 has_error 為 true，代表公式壞了，" +
    "禁止用 write_to_cell 寫入包含 VSTACK/FILTER/SORTBY/TAKE 等函數巢狀組合的複雜單一公式來做資料篩選、" +
    "排序或取前幾筆這類資料處理——這種公式極度脆弱、難以除錯，而且你本身有能力直接處理這些邏輯。" +
    "正確做法：先用 get_bloomberg_history 或 get_bloomberg_bulk 等工具取得原始資料（會以結構化 JSON 回傳給你），" +
    "自己在推理過程中完成排序、篩選、取前幾筆等運算，再用 write_table 把算好的最終結果（純數值，不是公式）寫進工作表。" +
    "write_to_cell 只適合寫入單一數值或簡單的一行公式（例如單純的 =A1+B1 或 =SUM(A1:A10)），不適合做複雜資料轉換。" +
    "呼叫 create_worksheet 建立新工作表時，工作表名稱要用有意義的繁體中文描述（例如「台積電選擇權分析」），" +
    "不要用時間戳記或亂碼當作工作表名稱。";

  // ============================================================
  // 工具定義
  // ============================================================
  const TOOLS = [
    { type: "web_search" },
    {
      type: "function", name: "get_bloomberg_field",
      description: "查詢單一證券的單一即時或最新欄位資料（對應 Bloomberg BDP 函數）。適合查股價、成交量、隱含波動率等單一數值。",
      parameters: {
        type: "object",
        properties: {
          ticker: { type: "string", description: "Bloomberg 代碼，例如 2330 TT Equity" },
          field: { type: "string", description: "Bloomberg 欄位代碼，例如 PX_LAST" }
        },
        required: ["ticker", "field"]
      }
    },
    {
      type: "function", name: "get_bloomberg_history",
      description: "查詢單一證券單一欄位的歷史時間序列（對應 Bloomberg BDH 函數）。",
      parameters: {
        type: "object",
        properties: {
          ticker: { type: "string", description: "Bloomberg 代碼" },
          field: { type: "string", description: "Bloomberg 欄位代碼" },
          start_date: { type: "string", description: "起始日期，格式 YYYYMMDD" },
          end_date: { type: "string", description: "結束日期，格式 YYYYMMDD" }
        },
        required: ["ticker", "field", "start_date", "end_date"]
      }
    },
    {
      type: "function", name: "get_bloomberg_bulk",
      description: "查詢會回傳多列資料的 Bloomberg 欄位（對應 BDS 函數），例如選擇權鏈 OPT_CHAIN。",
      parameters: {
        type: "object",
        properties: {
          ticker: { type: "string", description: "Bloomberg 代碼" },
          field: { type: "string", description: "Bloomberg 批次欄位代碼" }
        },
        required: ["ticker", "field"]
      }
    },
    {
      type: "function", name: "read_range",
      description: "讀取目前作用中工作表裡使用者既有的儲存格內容。",
      parameters: {
        type: "object",
        properties: { range_address: { type: "string", description: "A1 表示法範圍，例如 A1:C10" } },
        required: ["range_address"]
      }
    },
    {
      type: "function", name: "explain_formula",
      description: "讀取指定儲存格目前的公式與計算結果，用於向使用者解釋這格數字是怎麼算出來的。",
      parameters: {
        type: "object",
        properties: { cell_address: { type: "string", description: "A1 表示法儲存格，例如 F5" } },
        required: ["cell_address"]
      }
    },
    {
      type: "function", name: "write_to_cell",
      description: "把單一數值或公式寫入使用者目前作用中工作表的指定儲存格。執行前一定會先跳出確認視窗。",
      parameters: {
        type: "object",
        properties: {
          cell_address: { type: "string", description: "A1 表示法儲存格，例如 F5" },
          value: { type: "string", description: "要寫入的內容，可以是文字、數字，或以 = 開頭的公式" }
        },
        required: ["cell_address", "value"]
      }
    },
    {
      type: "function", name: "create_worksheet",
      description: "建立一個新的工作表並切換過去，用於輸出完整的分析報表。如果同名工作表已存在則直接切換過去，不會重建。",
      parameters: {
        type: "object",
        properties: { sheet_name: { type: "string", description: "新工作表名稱" } },
        required: ["sheet_name"]
      }
    },
    {
      type: "function", name: "write_table",
      description: "把一張二維表格寫入指定工作表的指定起始儲存格，系統會自動套用專業報表樣式。用於輸出完整的分析結果。執行前一定會先跳出確認視窗。",
      parameters: {
        type: "object",
        properties: {
          sheet_name: { type: "string", description: "目標工作表名稱（建議先呼叫 create_worksheet）" },
          start_cell: { type: "string", description: "起始儲存格，例如 A1" },
          rows: {
            type: "array", description: "二維陣列，每個元素是一列，第一列會被當成表頭並套用標題樣式",
            items: { type: "array", items: { type: "string" } }
          }
        },
        required: ["sheet_name", "start_cell", "rows"]
      }
    }
  ];
  const WRITE_TOOL_NAMES = new Set(["write_to_cell", "write_table", "create_worksheet"]);

  // ============================================================
  // UI 輔助：訊息渲染
  // ============================================================
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function autoResizeTextarea() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  }
  userInput.addEventListener('input', autoResizeTextarea);

  // Markdown 的跳脫符號機制會把 LaTeX 定界符（例如 \[ \( ）裡的反斜線吃掉，
  // 導致 KaTeX 事後完全找不到定界符、渲染不出數學公式。
  // 解法：先把整段數學內容抽換成不含特殊符號的代號、讓 Markdown 處理完其他排版，
  // 再把原始的 LaTeX 內容換回去，確保 KaTeX 拿到的定界符是完整、沒被動過的。
  function renderMarkdown(text) {
    const mathBlocks = [];
    const protectedText = text.replace(
      /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))/g,
      (match) => {
        const idx = mathBlocks.length;
        mathBlocks.push(match);
        return `@@MATH${idx}@@`;
      }
    );
    let raw = marked.parse(protectedText, { breaks: true });
    let clean = DOMPurify.sanitize(raw);
    clean = clean.replace(/@@MATH(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)] || '');
    return clean;
  }

  // 模型有時候會用 LaTeX 語法輸出數學式（例如 \[ \boxed{P=5.66\times10^3} \]），
  // Markdown 本身不認得這種語法，得靠 KaTeX 另外掃一次、把它排版成正常的數學公式。
  function renderMathIn(el) {
    if (typeof renderMathInElement === 'undefined') return;
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {
      // 數學排版失敗就保留原始文字，不影響訊息其他部分正常顯示
    }
  }

  function addMessage(role, text) {

  // 統一的寫入確認：不管這一輪有 1 個還是多個寫入動作，都走同一套流程，

  // ============================================================
  // 模型清單：動態抓取 + 依 OpenAI 官方定位分級 + 精簡/完整兩種顯示模式
  // ============================================================
  function getModelTierLabel(id) {
    const lower = id.toLowerCase();
    const firstSegment = lower.split(/[-_]/)[0];
    if (/^o\d/.test(firstSegment) && !lower.includes('codex')) return '推理強化版';
    if (lower.includes('codex')) return '程式碼專用版';
    if (lower.includes('nano')) return '極速版';
    if (lower.includes('mini')) return '輕量版';
    if (lower.includes('pro')) return '進階版';
    return '標準版';
  }

  function parseVersionKey(id) {
    const m = id.match(/(\d+(?:\.\d+)*)/);
    if (!m) return [0];
    return m[1].split('.').map(Number);
  }
  function compareVersions(a, b) {
    const va = parseVersionKey(a), vb = parseVersionKey(b);
    const len = Math.max(va.length, vb.length);
    for (let i = 0; i < len; i++) {
      const x = va[i] || 0, y = vb[i] || 0;
      if (x !== y) return x - y;
    }
    return 0;
  }

  // 精簡模式：每個等級只挑「版本最新」的一個代表，避免同一個標籤重複一長串
  function buildCuratedModelList(ids) {
    const skipPatterns = ['-latest', 'chat-latest'];
    const candidates = ids.filter(id => !skipPatterns.some(p => id.includes(p)));
    const byTier = {};
    candidates.forEach(id => {
      const tier = getModelTierLabel(id);
      if (!byTier[tier] || compareVersions(id, byTier[tier]) > 0) byTier[tier] = id;
    });
    const tierOrder = ['極速版', '輕量版', '標準版', '進階版', '程式碼專用版', '推理強化版'];
    return tierOrder.filter(t => byTier[t]).map(t => byTier[t]);
  }

  function populateModelSelect() {
    const select = document.getElementById('modelSelect');
    const ids = showAllModels ? allModelIds : buildCuratedModelList(allModelIds);
    select.innerHTML = '';
    let defaultSet = false;
    ids.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      opt.title = id;
      if (!defaultSet && getModelTierLabel(id) === '標準版') { opt.selected = true; defaultSet = true; }
      select.appendChild(opt);
    });
    if (!defaultSet && select.options.length > 0) select.options[0].selected = true;
    document.getElementById('modelToggle').textContent = showAllModels ? '只顯示精簡清單' : '顯示所有版本';
  }

  function toggleModelListMode() {
    showAllModels = !showAllModels;
    populateModelSelect();
  }

  async function loadModels(key) {
    const select = document.getElementById('modelSelect');
    const toggle = document.getElementById('modelToggle');
    try {
      const resp = await fetch(MODELS_URL, { headers: { 'Authorization': 'Bearer ' + key } });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error ? data.error.message : ('HTTP ' + resp.status));

      const EXCLUDE_PATTERNS = ['embedding', 'image', 'whisper', 'tts', 'realtime', 'transcribe', 'diarize', 'deep-research'];
      allModelIds = (data.data || []).map(m => m.id).filter(id =>
        !id.includes(':') && !EXCLUDE_PATTERNS.some(p => id.toLowerCase().includes(p))
      ).sort();

      if (allModelIds.length === 0) {
        select.innerHTML = '<option value="gpt-5.4-mini">gpt-5.4-mini</option>';
        toggle.style.display = 'none';
        return;
      }
      showAllModels = false;
      populateModelSelect();
      toggle.style.display = 'inline-block';
    } catch (e) {
      // 抓取失敗時清楚標示「未連線」，不要顯示一個看起來正常、可選、打勾的假選項，
      // 避免使用者看到「連線失敗」跟「模型選好了」同時出現這種矛盾畫面。
      select.innerHTML = '<option value="" disabled selected>（尚未連線，無法取得模型清單）</option>';
      toggle.style.display = 'none';
    }
  }

    try {

        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: getSelectedModel(), input: '回覆「ok」兩個字即可', max_output_tokens: 20 })
      });

        statusDiv.className = 'key-status ok';

  // ============================================================
  // 檔案附加：文字類 / PDF / Word / 圖片
  // ============================================================
  const TEXT_EXTS = ['txt', 'csv', 'json', 'md', 'tsv'];
  const MAX_TEXT_CHARS = 30000;

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  function readFileAsDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 不管卡住的真正原因是什麼（後端沒回應、網路問題、或其他未知狀況），
  // 都不該讓使用者永遠卡在「解析中」動彈不得——加一個逾時保護，超過時間直接判定失敗。
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(`${label}超過 ${ms / 1000} 秒沒有回應，已放棄解析，請稍後再試一次。`)), ms))
    ]);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // readAsDataURL 結果格式是 "data:application/pdf;base64,xxxx"，只取逗號後面的部分
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // PDF / Word 解析改由後端負責（extract.py，跑在 Vercel），用真正的 Python 函式庫
  // （pdfplumber / python-docx）解析，這跟 Claude、ChatGPT 平常處理檔案的方式一樣，
  // 不再依賴瀏覽器端的 CDN 函式庫，也就不會再受相容性問題影響。
  async function extractViaBackend(file, type, onProgress) {
    onProgress('① 正在讀取檔案內容...');
    const base64 = await fileToBase64(file);

    onProgress('② 檔案已讀取完成，正在傳送給伺服器解析（可能需要幾秒）...');
    let resp;
    try {
      resp = await fetch(EXTRACT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, content: base64 })
      });
    } catch (netErr) {
      throw new Error(`③ 網路請求失敗，很可能是連不到解析伺服器：${netErr.message}`);
    }

    onProgress(`③ 伺服器已回應（狀態碼 ${resp.status}），正在解析回傳內容...`);
    const data = await resp.json();
    if (!resp.ok || data.error) {
      throw new Error(data.error || `④ 後端解析失敗（HTTP ${resp.status}）`);
    }
    onProgress('④ 解析完成！');
    return data.text || '';
  }

  async function extractPdfText(file, onProgress) {
    return extractViaBackend(file, 'pdf', onProgress);
  }

  async function extractDocxText(file, onProgress) {
    return extractViaBackend(file, 'docx', onProgress);
  }

  document.getElementById('fileAttach').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();

    try {
      if (TEXT_EXTS.includes(ext)) {
        const text = await readFileAsText(file);
        const truncated = text.length > MAX_TEXT_CHARS;
        attachedFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
      } else if (ext === 'pdf') {
        const progress = (msg) => addMessage('system', msg);
        const text = await withTimeout(extractPdfText(file, progress), 20000, 'PDF 解析');
        const truncated = text.length > MAX_TEXT_CHARS;
        attachedFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
        if (!text.trim()) addMessage('system', '這份 PDF 似乎擷取不到文字內容，可能是掃描檔（純圖片），文字解析工具無法處理這種情況。');
      } else if (ext === 'docx') {
        const progress = (msg) => addMessage('system', msg);
        const text = await withTimeout(extractDocxText(file, progress), 20000, 'Word 解析');
        const truncated = text.length > MAX_TEXT_CHARS;
        attachedFile = { name: file.name, kind: 'text', content: truncated ? text.slice(0, MAX_TEXT_CHARS) : text, truncated };
      } else if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
        const dataUri = await readFileAsDataUri(file);
        attachedFile = { name: file.name, kind: 'image', dataUri };
      } else {
        addMessage('system', `不支援「.${ext}」這種檔案類型。目前支援：文字類（txt/csv/json/md/tsv）、PDF、Word（docx）、圖片（png/jpg/gif/webp）。`);
        return;
      }
      renderAttachmentChip();
    } catch (err) {
      addMessage('system', `解析檔案「${file.name}」時發生錯誤：${err.message}`);
    }
  });

  function renderAttachmentChip() {
    const row = document.getElementById('attachmentChipRow');
    row.innerHTML = '';
    if (!attachedFile) return;
    const chip = document.createElement('div');
    chip.className = 'chip';
    const icon = attachedFile.kind === 'image' ? '🖼️' : '📎';
    const label = document.createElement('span');
    label.textContent = icon + ' ' + attachedFile.name + (attachedFile.truncated ? '（已截斷）' : '');
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => { attachedFile = null; renderAttachmentChip(); };
    chip.appendChild(label);
    chip.appendChild(removeBtn);
    row.appendChild(chip);
  }

  // ============================================================
  // 選取範圍情境感知：事件驅動即時更新（不再用輪詢）
  // ============================================================
  let lastSelectionInfo = null;

  async function refreshSelectionInfo() {
    try {
      lastSelectionInfo = await Excel.run(async (context) => {
        const activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("name");
        const selection = context.workbook.getSelectedRange();
        selection.load("address,values");
        await context.sync();
        return {
          sheetName: activeSheet.name,
          address: selection.address,
          previewRows: selection.values.slice(0, 8).map(r => r.slice(0, 8))
        };
      });
    } catch (e) {
      lastSelectionInfo = null;
    }
    renderSelectionBar();
  }

  function renderSelectionBar() {
    const wrap = document.getElementById('selectionBarWrap');
    wrap.innerHTML = '';
    if (!lastSelectionInfo || excludeSelectionContext) return;
    const bar = document.createElement('div');
    bar.className = 'selection-bar';
    const label = document.createElement('span');
    // 去掉工作表前綴，只顯示簡短的範圍位址，仿照參考截圖那種「B11 selected」的簡潔感
    const shortAddr = lastSelectionInfo.address.includes('!')
      ? lastSelectionInfo.address.split('!')[1]
      : lastSelectionInfo.address;
    label.textContent = `${shortAddr} 已選取（${lastSelectionInfo.sheetName}）`;

    removeBtn.title = '不要把這個選取範圍送給 AI';
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => { excludeSelectionContext = true; renderSelectionBar(); };
    bar.appendChild(label);
    bar.appendChild(removeBtn);
    wrap.appendChild(bar);
  }

  async function setupSelectionListener() {
    try {
      await Excel.run(async (context) => {
        context.workbook.onSelectionChanged.add(async () => { await refreshSelectionInfo(); });
        await context.sync();
      });
    } catch (e) {
      // 監聽事件失敗（少見的環境限制）就退回輪詢，確保至少還會更新
      setInterval(refreshSelectionInfo, 3000);
    }
  }

  userInput.addEventListener('focus', () => {
    excludeSelectionContext = false;
    refreshSelectionInfo();
  });

  // ============================================================
  // Bloomberg / Excel 工具實作
  // ============================================================
  const BLOOMBERG_ERROR_MARKERS = [
    "#N/A", "Invalid Security", "Field Not Applicable", "Not Applicable",
    "Requesting Data", "#NAME?", "#REF!", "#VALUE!", "Unknown Field",
    "Invalid Field", "Insufficient", "Permission", "No Data", "Limit Reached",
    "Illegal", "Unauthorized", "PERM_DENIED", "DAPI"
  ];
  function detectBloombergError(text) {
    const s = String(text == null ? "" : text);
    return BLOOMBERG_ERROR_MARKERS.some(m => s.includes(m));
  }

  function friendlyExcelError(e) {
    const code = e && e.code ? e.code : "";
    const raw = e && e.message ? e.message : String(e);
    const hints = {
      "ItemNotFound": "找不到指定的工作表或範圍，請確認工作表名稱、儲存格位址是否正確。",
      "InvalidArgument": "提供的儲存格範圍格式不正確（例如 A1:C10 這種 A1 表示法），請檢查格式。",
      "GeneralException": "Excel 執行時發生一般性錯誤，可能是活頁簿正在被鎖定或有未完成的編輯，請確認目前沒有儲存格處於編輯狀態後再試一次。",
      "InvalidOperation": "目前無法對這個工作表執行此操作，可能是工作表已被保護。"
    };
    return hints[code] || raw;
  }

  function truncateSafely(str, maxChars) {
    const chars = Array.from(str);
    if (chars.length <= maxChars) return str;
    return chars.slice(0, maxChars).join('') + ' ...(已截斷)';
  }

  function formatToolResultForDisplay(result) {
    try {
      const pretty = JSON.stringify(result, null, 2);
      return truncateSafely(pretty, 500);
    } catch (e) {
      return truncateSafely(String(result), 500);
    }
  }

  function sanitizeForFormula(str) {
    return String(str).replace(/["\r\n]/g, '').trim();
  }

  async function getScratchSheet(context) {
    const sheets = context.workbook.worksheets;
    sheets.load("items/name");
    await context.sync();
    let sheet = sheets.items.find(s => s.name === SCRATCH_SHEET);
    if (!sheet) { sheets.add(SCRATCH_SHEET); await context.sync(); }
    return context.workbook.worksheets.getItem(SCRATCH_SHEET);
  }

  async function waitForValue(context, range, timeoutMs = 8000, intervalMs = 400) {
    const start = Date.now();
    let lastText = "";
    while (Date.now() - start < timeoutMs) {
      range.load("values,text");
      await context.sync();
      lastText = range.values;
      const flat = JSON.stringify(lastText);
      if (!flat.includes("Requesting") && !flat.includes("#N/A Requesting")) return lastText;
      await new Promise(r => setTimeout(r, intervalMs));
    }
    return lastText;
  }

  async function toolGetBloombergField(args) {
    return Excel.run(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow++;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDP("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}")`]];
      await context.sync();
      const value = await waitForValue(context, cell);
      const raw = value[0][0];
      const hasError = detectBloombergError(raw);
      return {
        ticker: args.ticker, field: args.field, value: raw, has_error: hasError,
        note: hasError ? "回傳內容看起來像錯誤或尚未完成讀取（例如代碼打錯、欄位不存在、或仍在向 Bloomberg 要資料）。請確認證券代碼與欄位代碼是否正確，必要時換一個欄位再試，不要直接把這個值當成真實資料使用。" : undefined
      };
    });
  }

  async function toolGetBloombergHistory(args) {
    return Excel.run(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow; scratchRow += 60;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDH("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}","${sanitizeForFormula(args.start_date)}","${sanitizeForFormula(args.end_date)}")`]];
      await context.sync();
      const resultRange = sheet.getRange(`A${row}:B${row + 55}`);
      const values = await waitForValue(context, resultRange, 10000);
      const rows = values.filter(r => r[0] !== "" && r[0] !== null);
      const hasError = rows.length === 0 || rows.some(r => detectBloombergError(r[0]) || detectBloombergError(r[1]));
      return {
        ticker: args.ticker, field: args.field, rows, has_error: hasError,
        note: hasError ? "查詢結果為空或包含錯誤標記，請確認代碼、欄位、日期區間是否正確。" : undefined
      };
    });
  }

  async function toolGetBloombergBulk(args) {
    return Excel.run(async (context) => {
      const sheet = await getScratchSheet(context);
      const row = scratchRow; scratchRow += 200;
      const cell = sheet.getRange(`A${row}`);
      cell.formulas = [[`=BDS("${sanitizeForFormula(args.ticker)}","${sanitizeForFormula(args.field)}")`]];
      await context.sync();
      const resultRange = sheet.getRange(`A${row}:J${row + 195}`);
      const values = await waitForValue(context, resultRange, 12000);
      const rows = values.filter(r => r.some(v => v !== "" && v !== null));
      const hasError = rows.length === 0 || detectBloombergError(rows[0] && rows[0][0]);
      const truncated = rows.length > 50;
      return {
        ticker: args.ticker, field: args.field, row_count: rows.length,
        rows: rows.slice(0, 50), truncated, has_error: hasError,
        note: [
          hasError ? "查詢結果為空或包含錯誤標記，請確認代碼與欄位是否正確。" : null,
          truncated ? `結果共 ${rows.length} 列，這裡只回傳前 50 列供分析；完整資料仍寫在 AI_Scratch 工作表第 ${row} 列開始。` : null
        ].filter(Boolean).join(" ") || undefined
      };
    });
  }

  async function toolExplainFormula(args) {
    return Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const cell = sheet.getRange(args.cell_address);
      cell.load("formulas,values,valueTypes");
      await context.sync();
      const formula = cell.formulas[0][0];
      return {
        cell_address: args.cell_address,
        formula: formula,
        is_formula: typeof formula === "string" && formula.startsWith("="),
        current_value: cell.values[0][0]
      };
    });
  }

  async function toolReadRange(args) {
    return Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const range = sheet.getRange(args.range_address);
      range.load("values,rowCount,columnCount");
      await context.sync();

      // 選取範圍太大（例如整欄、上百列）會讓回傳資料塞爆對話的 token 預算，
      // 導致最後模型擠不出結論文字。這裡設一個保守的上限，超過就只回傳
      // 前面一部分並清楚告知已截斷，模型看到 truncated 應該主動建議使用者縮小範圍
      // 或改用 get_bloomberg_history / get_bloomberg_bulk 這類本身就有截斷保護的工具。
      const MAX_ROWS = 60;
      const totalRows = range.values.length;
      const truncated = totalRows > MAX_ROWS;
      const values = truncated ? range.values.slice(0, MAX_ROWS) : range.values;

      return {
        range: args.range_address,
        row_count: totalRows,
        column_count: range.columnCount,
        values,
        truncated,
        note: truncated
          ? `這個範圍共 ${totalRows} 列，資料量太大，這裡只回傳前 ${MAX_ROWS} 列。如果需要完整分析，建議請使用者縮小選取範圍，或分成幾次個別查詢。`
          : undefined
      };
    });
  }

  async function toolWriteToCell(args) {
    return Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();
      const cell = sheet.getRange(args.cell_address);
      if (args.value.startsWith("=")) cell.formulas = [[args.value]];
      else cell.values = [[args.value]];
      await context.sync();

      cell.load("values,valueTypes");
      await context.sync();
      const isError = cell.valueTypes[0][0] === "Error";
      const resultValue = cell.values[0][0];

      return {
        written: true,
        cell_address: args.cell_address,
        actual_result: resultValue,
        has_error: isError,
        note: isError
          ? "公式計算結果是錯誤值，請檢查公式邏輯（例如 FILTER 找不到資料時需要加 if_empty 參數）並重新呼叫 write_to_cell 修正"
          : undefined
      };
    });
  }

  async function toolCreateWorksheet(args) {
    return Excel.run(async (context) => {
      const sheets = context.workbook.worksheets;
      sheets.load("items/name");
      await context.sync();
      const existed = sheets.items.some(s => s.name === args.sheet_name);
      if (!existed) { sheets.add(args.sheet_name); await context.sync(); }
      context.workbook.worksheets.getItem(args.sheet_name).activate();
      await context.sync();
      return { created: !existed, sheet_name: args.sheet_name };
    });
  }

  function colLetterToIndex(letters) {
    let n = 0;
    for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  function colIndexToLetter(index) {
    let n = index + 1, s = "";
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  async function toolWriteTable(args) {
    return Excel.run(async (context) => {
      const sheets = context.workbook.worksheets;
      sheets.load("items/name");
      await context.sync();
      if (!sheets.items.some(s => s.name === args.sheet_name)) { sheets.add(args.sheet_name); await context.sync(); }
      const targetSheet = context.workbook.worksheets.getItem(args.sheet_name);

      const nRows = args.rows.length;
      const nCols = Math.max(...args.rows.map(r => r.length));
      const normalized = args.rows.map(r => {
        const copy = r.slice();
        while (copy.length < nCols) copy.push("");
        return copy;
      });

      const startCol = args.start_cell.match(/[A-Z]+/)[0];
      const startRowNum = parseInt(args.start_cell.match(/\d+/)[0], 10);
      const endColIndex = colLetterToIndex(startCol) + nCols - 1;
      const endCol = colIndexToLetter(endColIndex);
      const endRowNum = startRowNum + nRows - 1;
      const fullRange = targetSheet.getRange(`${startCol}${startRowNum}:${endCol}${endRowNum}`);
      fullRange.values = normalized;

      try {
        const headerRange = targetSheet.getRange(`${startCol}${startRowNum}:${endCol}${startRowNum}`);
        headerRange.format.font.bold = true;
        headerRange.format.font.color = "white";
        headerRange.format.fill.color = "#0B3D62";

        for (let r = 1; r < nRows; r++) {
          const rowNum = startRowNum + r;
          const rowRange = targetSheet.getRange(`${startCol}${rowNum}:${endCol}${rowNum}`);
          rowRange.format.fill.color = (r % 2 === 0) ? "#F5F9FF" : "#FFFFFF";
        }

        const borderSides = ["EdgeTop", "EdgeBottom", "EdgeLeft", "EdgeRight", "InsideHorizontal", "InsideVertical"];
        borderSides.forEach(side => {
          const b = fullRange.format.borders.getItem(side);
          b.style = "Continuous";
          b.color = "#DDE3EA";
          b.weight = "Thin";
        });

        fullRange.format.autofitColumns();
      } catch (styleErr) {
        // 樣式套用失敗不影響資料本身已經寫入成功，安靜略過即可
      }

      targetSheet.activate();
      await context.sync();
      return { written: true, sheet_name: args.sheet_name, range: `${args.start_cell}:${endCol}${endRowNum}` };
    });
  }

  function describeToolCall(name, args) {
    args = args || {};
    switch (name) {
      case "get_bloomberg_field": return `查詢 Bloomberg：${args.ticker || '?'} 的 ${args.field || '?'}`;
      case "get_bloomberg_history": return `查詢 Bloomberg 歷史資料：${args.ticker || '?'} 的 ${args.field || '?'}（${args.start_date || '?'} ~ ${args.end_date || '?'}）`;
      case "get_bloomberg_bulk": return `查詢 Bloomberg 批次資料：${args.ticker || '?'} 的 ${args.field || '?'}`;
      case "read_range": return `讀取工作表範圍：${args.range_address || '?'}`;
      case "explain_formula": return `解釋儲存格 ${args.cell_address || '?'} 的公式`;
      case "write_to_cell": return `寫入儲存格 ${args.cell_address || '?'}：${args.value || ''}`;
      case "create_worksheet": return `建立/切換工作表：${args.sheet_name || '?'}`;
      case "write_table": return `寫入表格到「${args.sheet_name || '?'}」（${(args.rows && args.rows.length) || 0} 列）`;
      default: return name;
    }
  }

  function summarizeToolResult(name, args, result) {
    if (result && result.error) return '執行失敗：' + result.error;
    switch (name) {
      case "get_bloomberg_field":
        return result.has_error
          ? `查詢 ${args.ticker} 的 ${args.field} 時似乎出錯或查無資料`
          : `${args.ticker} 的 ${args.field}：${result.value}`;
      case "write_to_cell":
        return result.written
          ? (result.has_error ? `已寫入 ${args.cell_address}，但公式算出錯誤值` : `已寫入 ${args.cell_address}`)
          : `未寫入（${result.reason || '使用者取消'}）`;
      case "create_worksheet":
        return result.created ? `已建立工作表「${args.sheet_name}」` : `已切換到工作表「${args.sheet_name}」`;
      case "write_table":
        return result.written ? `已寫入表格到「${args.sheet_name}」（${result.range}）` : `未寫入（${result.reason || '使用者取消'}）`;
      case "read_range":
        return `已讀取 ${args.range_address} 的內容`;
      case "explain_formula":
        return result.is_formula ? `${args.cell_address} 的公式：${result.formula}` : `${args.cell_address} 目前不是公式，值為 ${result.current_value}`;
      default:
        return describeToolCall(name, args);
    }
  }

  async function executeTool(name, args) {
    switch (name) {
      case "get_bloomberg_field": return toolGetBloombergField(args);
      case "get_bloomberg_history": return toolGetBloombergHistory(args);
      case "get_bloomberg_bulk": return toolGetBloombergBulk(args);
      case "read_range": return toolReadRange(args);
      case "explain_formula": return toolExplainFormula(args);
      case "write_to_cell": return toolWriteToCell(args);
      case "create_worksheet": return toolCreateWorksheet(args);
      case "write_table": return toolWriteTable(args);
      default: return { error: `未知的工具：${name}` };
    }
  }

  // ============================================================
  // 核心：多輪工具呼叫迴圈
  // ============================================================
  let currentAbortController = null;
  const REQUEST_TIMEOUT_MS = 30000;

  function stopCurrentRequest() {
    if (currentAbortController) currentAbortController.abort();
  }

  async function callModel(payload, attempt = 1) {
    const key = document.getElementById('apiKey').value.trim();
    currentAbortController = new AbortController();
    const timeoutId = setTimeout(() => currentAbortController.abort(), REQUEST_TIMEOUT_MS);

    let resp;
    try {
      resp = await fetch(CGU_URL, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: currentAbortController.signal
      });
    } catch (e) {
      clearTimeout(timeoutId);
      if (e.name === 'AbortError') throw new Error('請求已中斷（可能是逾時超過 30 秒未回應，或你按了停止）');
      throw new Error('網路連線失敗：' + e.message);
    }
    clearTimeout(timeoutId);

    if ((resp.status === 429 || resp.status >= 500) && attempt <= 3) {
      await new Promise(r => setTimeout(r, attempt * 1200));
      return callModel(payload, attempt + 1);
    }

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error ? data.error.message : ('HTTP ' + resp.status));
    return data;
  }

  function getSelectionContextNote() {
    if (excludeSelectionContext || !lastSelectionInfo) return "";
    return `【目前 Excel 狀態】目前作用中工作表：${lastSelectionInfo.sheetName}｜` +
      `目前選取範圍：${lastSelectionInfo.address}｜選取內容預覽（最多 8x8）：${JSON.stringify(lastSelectionInfo.previewRows)}`;
  }

  function looksLikeDanglingCallError(message) {
    const m = (message || "").toLowerCase();
    return (m.includes("tool") && (m.includes("output") || m.includes("call"))) ||
           m.includes("function_call") || m.includes("no tool output");
  }

  // 當模型沒有回傳任何文字內容時，與其顯示籠統的「沒有收到文字回覆」，
  // 檢查 API 回傳的狀態，能講出具體原因（最常見：回覆因為長度上限被截斷）就講清楚，
  // 讓使用者知道該怎麼調整（縮小範圍、拆成幾個問題），而不是不明所以地卡住。
  function explainEmptyReply(data) {
    if (data && data.status === 'incomplete') {
      const reason = data.incomplete_details && data.incomplete_details.reason;
      if (reason === 'max_output_tokens') {
        return '這次要分析的資料量比較大，回覆內容超過長度上限被截斷了，沒能產生完整結論。建議縮小分析範圍（例如只看一個年份、一個分類，或選取範圍小一點），或把問題拆成幾個較小的問題分開問。';
      }
      return `這次的回覆被提前中止了（原因：${reason || '未知'}），沒能產生完整內容，建議換個方式重新提問一次。`;
    }
    return '模型這次沒有回傳任何文字內容，可能是暫時性問題，建議重新問一次；如果同樣的問題重複發生，很可能是這次牽涉的資料量太大，建議縮小範圍再試。';
  }

  // 組出送給 API 的 input：純文字時是字串；有附加圖片時要組成多模態內容陣列
  function buildApiInput(text, contextNote, file) {
    let combinedText = text;
    if (file && file.kind === 'text') {
      combinedText = `【附加檔案：${file.name}】\n${file.content}\n【附加檔案結束】\n\n${combinedText}`;
    }
    if (contextNote) combinedText = `${contextNote}\n\n使用者的問題：${combinedText}`;

    if (file && file.kind === 'image') {
      return [{
        role: "user",
        content: [
          { type: "input_text", text: combinedText },
          { type: "input_image", image_url: file.dataUri }
        ]
      }];
    }
    return combinedText;
  }

  async function sendMessage() {
    const key = document.getElementById('apiKey').value.trim();
    const text = userInput.value.trim();
    if (!key) { addMessage('system', '請先在上面輸入你的 CGU API Key 並按「連線」'); return; }
    if (!text) return;

    addMessage('user', text + (attachedFile ? `\n\n[已附加：${attachedFile.name}]` : ''));
    userInput.value = '';
    autoResizeTextarea();
    sendBtn.disabled = true;
    document.getElementById('stopBtn').style.display = 'inline-block';
    let thinking = addThinkingMessage('思考中');
    const model = getSelectedModel();
    const fileForThisTurn = attachedFile;

    try {
      const contextNote = getSelectionContextNote();
      const apiInput = buildApiInput(text, contextNote, fileForThisTurn);

      let payload = {
        model, input: apiInput,
        instructions: previousResponseId ? undefined : SYSTEM_INSTRUCTIONS,
        tools: TOOLS, max_output_tokens: 2500
      };
      if (previousResponseId) payload.previous_response_id = previousResponseId;

      for (let round = 0; round < 6; round++) {
        const data = await callModel(payload);
        previousResponseId = data.id;

        const functionCalls = (data.output || []).filter(i => i.type === "function_call");
        const webSearchCalls = (data.output || []).filter(i => i.type === "web_search_call");
        const messages = (data.output || []).filter(i => i.type === "message");

        for (const ws of webSearchCalls) {
          const q = ws.action && (ws.action.query || (ws.action.queries || []).join('、'));
          addToolMessage('🔍 已搜尋網路' + (q ? '：' + q : ''), JSON.stringify(ws.action || {}));
        }

        if (functionCalls.length === 0) {
          thinking.remove();
          let replyText = null;
          for (const m of messages) for (const c of (m.content || []))
            if (c.type === "output_text") replyText = c.text;
          if (!replyText) replyText = explainEmptyReply(data);
          await typewriterReveal(replyText);
          return;
        }

        const parsedCalls = functionCalls.map(fc => {
          let args = null, parseError = null;
          try { args = JSON.parse(fc.arguments || "{}"); }
          catch (e) { parseError = "arguments 不是合法的 JSON"; }
          return { fc, args: args || {}, parseError };
        });

        // 統一的「Accept All Edits」：這一輪只要有寫入動作（不論一個還是多個），
        // 一律先跳一次確認視窗，允許了才會真的去執行。
        const writeCalls = parsedCalls.filter(p => WRITE_TOOL_NAMES.has(p.fc.name) && !p.parseError);
        let writesApproved = true;
        if (writeCalls.length > 0) {
          setThinkingText('等待你確認寫入動作');
          writesApproved = await confirmWrites(writeCalls.map(p => ({ name: p.fc.name, _args: p.args })));
        }

        const toolOutputs = [];
        for (const { fc, args, parseError } of parsedCalls) {
          let result;
          let description = "(無法解析的工具呼叫)";
          try { description = describeToolCall(fc.name, args); } catch (e) { /* 用預設值 */ }

          if (parseError) {
            result = { error: parseError };
          } else if (WRITE_TOOL_NAMES.has(fc.name) && !writesApproved) {
            result = { written: false, reason: "使用者取消了本批寫入動作" };
          } else {
            setThinkingText('執行中：' + description);
            try {
              result = await executeTool(fc.name, args);
            } catch (e) {
              result = { error: friendlyExcelError(e) };
            }
          }

          try {
            let summary = "?";
            try { summary = summarizeToolResult(fc.name, args, result); } catch (e) { summary = description; }
            addToolMessage(summary, formatToolResultForDisplay(result));
          } catch (e) { /* 顯示失敗不影響 API 合約，安靜略過 */ }

          toolOutputs.push({ type: "function_call_output", call_id: fc.call_id, output: JSON.stringify(result) });
        }

        payload = { model, previous_response_id: previousResponseId, input: toolOutputs, tools: TOOLS, max_output_tokens: 2500 };
        thinking.remove();
        thinking = addThinkingMessage('思考中');
      }

      setThinkingText('整理已取得的資料，準備做結論');
      try {
        const wrapUp = await callModel({
          model, previous_response_id: previousResponseId,
          input: "已達到本輪工具呼叫次數上限，請不要再嘗試呼叫任何工具，直接根據目前為止已經取得的資料，給出你能給出的最佳結論、分析或摘要，並說明還有哪些資訊尚未查到。",
          max_output_tokens: 1500
        });
        previousResponseId = wrapUp.id;
        thinking.remove();
        let replyText = null;
        for (const m of (wrapUp.output || []).filter(i => i.type === "message"))
          for (const c of (m.content || [])) if (c.type === "output_text") replyText = c.text;
        if (!replyText) replyText = explainEmptyReply(wrapUp);
        await typewriterReveal(replyText);
      } catch (e) {
        thinking.remove();
        addMessage('system', '工具呼叫次數過多，且收尾總結也失敗了：' + e.message);
      }
    } catch (e) {
      thinking.remove();
      if (looksLikeDanglingCallError(e.message)) {
        previousResponseId = null;
        addMessage('system', '偵測到對話狀態異常（伺服器回報有未完成的工具呼叫），已自動重新開始對話，請重新描述你的問題。');
      } else {
        addMessage('system', '發生錯誤：' + e.message);
      }
    } finally {
      sendBtn.disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      currentAbortController = null;
      attachedFile = null;
      renderAttachmentChip();
    }
  }

  Office.onReady(() => {
    addMessage('system', '請貼上你的 CGU API Key 並按「連線」開始使用。');
    refreshSelectionInfo();
    setupSelectionListener();
  });
</script>
</body>
